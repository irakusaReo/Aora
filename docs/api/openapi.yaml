  /v1/kelo/purchases:
    post:
      tags: [KELO]
      operationId: createKeloPurchase
      summary: Buy on layaway
      description: >
        No credit is extended. Reserves the item or place in the same transaction, records consent to the named terms version, and creates the schedule. `expected_total_minor` must equal the total shown (`fee_changed` otherwise). `sold_out` when nothing is left.
      security: [{ session: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [listing_id, template_key, expected_total_minor, terms_version]
              properties:
                listing_id: { type: string, format: uuid }
                variant_id: { type: string, format: uuid }
                session_id: { type: string, format: uuid }
                template_key: { type: string }
                expected_total_minor: { $ref: '#/components/schemas/AmountMinor' }
                terms_version: { type: string }
      responses:
        '201':
          description: Purchase placed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeloPurchase' }
        '200':
          description: Replay of an earlier request with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeloPurchase' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

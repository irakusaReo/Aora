    get:
      tags: [KELO]
      operationId: getMyKeloPurchase
      summary: One of the signed-in buyer's purchases
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:

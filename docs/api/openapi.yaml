openapi: 3.1.0
info:
  title: AORA API
  version: 0.1.0
  summary: SANDBOX ONLY. No real money moves through this API.
  description: |
    Sign-in with a phone number and a one-time code, PIN step-up, workspace
    members and balances, consent records, collection payment intents against
    the AORA simulator provider, simulator webhook intake, operator
    reconciliation endpoints and scheduler-triggered jobs.

    Conventions:
    - Every response carries the header `Aora-Mode: sandbox`, and every JSON
      object body carries `"mode": "sandbox"`.
    - Every response carries `Aora-Request-Id`.
    - Amounts are strings of digits in minor units, for example `"15000"` for
      KES 150.00. JSON numbers are rejected.
    - `POST` requests that create a financial operation require an
      `Idempotency-Key` header. The same key with the same body returns the
      original result with status 200 and `Idempotent-Replay: true`. The same
      key with a different body returns 409.
    - Error codes are stable. Changing or removing one is a breaking change.
servers:
  - url: http://127.0.0.1:3000
    description: Local sandbox
tags:
  - name: Health
  - name: Auth
  - name: Workspace
  - name: Consent
  - name: Payment intents
  - name: Webhooks
  - name: Operations
  - name: Internal
paths:
  /v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and database check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, database, mode]
                properties:
                  status: { const: ok }
                  database: { const: ok }
                  mode: { $ref: '#/components/schemas/Mode' }
  /v1/auth/challenges:
    post:
      tags: [Auth]
      operationId: startSignIn
      summary: Start sign-in for a phone number
      description: >
        Always returns a challenge id, whether or not the number is registered.
        A random six-digit code is sent by SMS. Rate-limited per phone number and per client address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
      responses:
        '201': { $ref: '#/components/responses/Challenge' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/auth/sessions:
    post:
      tags: [Auth]
      operationId: createSession
      summary: Exchange a challenge and code for a session token
      requestBody: { $ref: '#/components/requestBodies/ChallengeAnswer' }
      responses:
        '201':
          description: Session created. The token is shown once.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at, mode]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/auth/session:
    delete:
      tags: [Auth]
      operationId: signOut
      summary: Sign out (revokes the session)
      security: [{ session: [] }]
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Error' }
  /v1/auth/pin/challenges:
    post:
      tags: [Auth]
      operationId: startPinChange
      summary: Send a one-time code to set or change the PIN
      security: [{ session: [] }]
      responses:
        '201': { $ref: '#/components/responses/Challenge' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/auth/pin:
    put:
      tags: [Auth]
      operationId: setPin
      summary: Set or change the transaction PIN
      description: >
        Always needs a fresh one-time code from `POST /v1/auth/pin/challenges`.
        The PIN is six digits and may not be a repeated digit or a simple sequence.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pin, challenge_id, code]
              properties:
                pin: { type: string, pattern: '^[0-9]{6}$' }
                challenge_id: { type: string }
                code: { type: string, minLength: 1, maxLength: 12 }
      responses:
        '200':
          description: PIN set
          content:
            application/json:
              schema:
                type: object
                required: [pin_set, mode]
                properties:
                  pin_set: { const: true }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/auth/step-up:
    post:
      tags: [Auth]
      operationId: completeStepUp
      summary: Confirm a sensitive action with the PIN
      description: >
        Sensitive actions require a step-up completed within the last few minutes
        on the same session. After repeated wrong PINs the PIN is locked for a
        while; it can be replaced with a one-time code.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pin]
              properties:
                pin: { type: string }
      responses:
        '200':
          description: Step-up recorded
          content:
            application/json:
              schema:
                type: object
                required: [step_up_until, mode]
                properties:
                  step_up_until: { type: string, format: date-time }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The signed-in account and its workspace memberships
      security: [{ session: [] }]
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                type: object
                required: [account_id, is_platform_operator, memberships, mode]
                properties:
                  account_id: { type: string, format: uuid }
                  is_platform_operator: { type: boolean }
                  memberships:
                    type: array
                    items:
                      type: object
                      required: [workspace_id, role]
                      properties:
                        workspace_id: { type: string, format: uuid }
                        role: { enum: [admin, finance, cashier] }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/payment-intents:
    post:
      tags: [Payment intents]
      operationId: createPaymentIntent
      summary: Create a collection payment intent
      description: >
        Roles: admin, finance, cashier. The intent is submitted to the provider
        asynchronously; poll `GET /v1/payment-intents/{id}` for its status.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_minor, currency]
              properties:
                amount_minor: { $ref: '#/components/schemas/AmountMinor' }
                currency: { type: string, pattern: '^[A-Z]{3}$', examples: [KES] }
                sandbox_scenario:
                  description: Sandbox only. Makes the simulator provider behave in a chosen way.
                  enum:
                    - success
                    - decline
                    - timeout_then_success
                    - timeout_then_failure
                    - duplicate_webhook
                    - late_webhook
                    - amount_mismatch
                    - missing_settlement_line
      responses:
        '201': { $ref: '#/components/responses/PaymentIntent' }
        '200':
          description: Replay of an earlier request with the same key and body
          headers:
            Idempotent-Replay: { schema: { const: 'true' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/payment-intents/{id}:
    get:
      tags: [Payment intents]
      operationId: getPaymentIntent
      summary: Status lookup for a payment intent
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/PaymentIntent' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/webhooks/sandbox:
    post:
      tags: [Webhooks]
      operationId: receiveSandboxWebhook
      summary: Webhook intake for the AORA simulator provider
      description: >
        Authenticated by an HMAC-SHA-256 signature over the raw body, not by a
        session. Duplicate deliveries are accepted and have no further effect.
      parameters:
        - name: Aora-Sim-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, type, operation_ref, provider_reference, result, amount_minor, asset]
              properties:
                event_id: { type: string }
                type: { const: collection.result }
                operation_ref: { type: string }
                provider_reference: { type: string }
                result: { enum: [succeeded, failed] }
                amount_minor: { $ref: '#/components/schemas/AmountMinor' }
                asset: { type: string }
      responses:
        '200':
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [received, mode]
                properties:
                  received: { const: true }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/ops/reconciliation-runs:
    post:
      tags: [Operations]
      operationId: runReconciliation
      summary: Run reconciliation now
      description: >
        Platform operators only. Compares the provider's settlement report with
        payment intents and the ledger and records differences. Corrects nothing.
      security: [{ session: [] }]
      responses:
        '201':
          description: Run finished
          content:
            application/json:
              schema:
                type: object
                required: [run_id, lines_checked, intents_checked, exceptions_opened, mode]
                properties:
                  run_id: { type: string, format: uuid }
                  lines_checked: { type: integer }
                  intents_checked: { type: integer }
                  exceptions_opened: { type: integer }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/ops/reconciliation-exceptions:
    get:
      tags: [Operations]
      operationId: listReconciliationExceptions
      summary: List reconciliation exceptions, newest first
      security: [{ session: [] }]
      responses:
        '200':
          description: Exceptions
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReconciliationException' }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/ops/reconciliation-exceptions/{id}:
    get:
      tags: [Operations]
      operationId: getReconciliationException
      summary: Inspect one reconciliation exception
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Exception
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationException' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/workspace/members:
    get:
      tags: [Workspace]
      operationId: listMembers
      summary: List the workspace's members
      description: 'Permission: `member.read` (admin, finance).'
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Member' } }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Workspace]
      operationId: addMember
      summary: Add a member by phone number
      description: 'Permission: `member.manage` (admin). Requires a PIN step-up.'
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, role]
              properties:
                phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/workspace/members/{id}:
    patch:
      tags: [Workspace]
      operationId: updateMember
      summary: Change a member's role, or remove them
      description: >
        Permission: `member.manage` (admin). Requires a PIN step-up. Send either
        `role` or `status`. A workspace always keeps at least one active admin.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { $ref: '#/components/schemas/Role' }
                status: { const: removed }
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/ledger/balances:
    get:
      tags: [Workspace]
      operationId: listBalances
      summary: The workspace's ledger balances, one per account type
      description: >
        Permission: `ledger.read` (admin, finance). Each account type is a
        different kind of balance; they are never added together.
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [account_type, currency, balance_minor]
                      properties:
                        account_type: { type: string }
                        currency: { type: string }
                        balance_minor: { type: string, pattern: '^-?[0-9]+$' }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/terms/{key}:
    get:
      tags: [Consent]
      operationId: getTerms
      summary: The terms version currently in effect
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Terms
          content:
            application/json:
              schema:
                type: object
                required: [key, version, language, title, body, body_sha256, effective_from, mode]
                properties:
                  key: { type: string }
                  version: { type: string }
                  language: { type: string }
                  title: { type: string }
                  body: { type: string }
                  body_sha256: { type: string }
                  effective_from: { type: string, format: date-time }
                  mode: { $ref: '#/components/schemas/Mode' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/consents:
    post:
      tags: [Consent]
      operationId: recordConsent
      summary: Record consent to a terms version
      description: >
        Records the person, the capacity in which they act, the action, the time
        and the exact terms version. The version must be the one in effect.
        `workspace_id` is required for `business` capacity and refused otherwise.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [terms_key, terms_version, action, capacity]
              properties:
                terms_key: { type: string }
                terms_version: { type: string }
                action: { type: string }
                capacity: { enum: [personal, business] }
                workspace_id: { type: string, format: uuid }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [id, created_at, mode]
                properties:
                  id: { type: string, format: uuid }
                  created_at: { type: string, format: date-time }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/internal/cron/outbox:
    get:
      tags: [Internal]
      operationId: cronOutbox
      summary: Drain the outbox (called by the scheduler)
      description: Idempotent and time-bounded. Authenticated with the cron secret.
      security: [{ cron: [] }]
      responses:
        '200': { $ref: '#/components/responses/Job' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/internal/cron/sim-webhooks:
    get:
      tags: [Internal]
      operationId: cronSimulatorWebhooks
      summary: Deliver due simulator webhooks (sandbox only)
      security: [{ cron: [] }]
      responses:
        '200': { $ref: '#/components/responses/Job' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/internal/cron/reconciliation:
    get:
      tags: [Internal]
      operationId: cronReconciliation
      summary: Run reconciliation unless a run is already in progress
      security: [{ cron: [] }]
      responses:
        '200': { $ref: '#/components/responses/Job' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/internal/sandbox/sms:
    get:
      tags: [Internal]
      operationId: listSimulatedSms
      summary: Read simulated SMS messages (sandbox only)
      description: >
        Exists only while the simulated SMS sender is in use and an inbox token
        is configured; otherwise it returns 404.
      security: [{ inbox: [] }]
      parameters:
        - { name: phone, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Messages, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data: { type: array, items: { type: object } }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: Session token from `POST /v1/auth/sessions`.
    cron:
      type: http
      scheme: bearer
      description: The deployment's cron secret. Sent by the scheduler only.
    inbox:
      type: http
      scheme: bearer
      description: The sandbox SMS inbox token.
  parameters:
    Workspace:
      name: Aora-Workspace-Id
      in: header
      required: true
      description: The workspace to act in. The caller must be a member.
      schema: { type: string, format: uuid }
  requestBodies:
    ChallengeAnswer:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [challenge_id, code]
            properties:
              challenge_id: { type: string }
              code: { type: string, minLength: 1, maxLength: 12 }
  responses:
    Challenge:
      description: Challenge started
      content:
        application/json:
          schema:
            type: object
            required: [challenge_id, mode]
            properties:
              challenge_id: { type: string, format: uuid }
              mode: { $ref: '#/components/schemas/Mode' }
    Job:
      description: Job result
      content:
        application/json:
          schema:
            type: object
            required: [job, mode]
            properties:
              job: { type: string }
              mode: { $ref: '#/components/schemas/Mode' }
    PaymentIntent:
      description: Payment intent
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaymentIntent' }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Mode:
      const: sandbox
      description: Every record and response is sandbox data.
    Role:
      enum: [admin, finance, cashier]
    Member:
      type: object
      required: [id, account_id, role, status, phone_hint]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        status: { enum: [active, removed] }
        phone_hint: { type: string, description: Last three digits of the member's phone number. }
        mode: { $ref: '#/components/schemas/Mode' }
    AmountMinor:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: Integer amount in the currency's minor units, as a string.
      examples: ['15000']
    PaymentIntentStatus:
      description: |
        - `created`: accepted by AORA, not yet sent to the provider.
        - `submitting`: being sent to the provider.
        - `pending_provider`: accepted by the provider, awaiting its result.
        - `succeeded`: paid, and recorded in the ledger.
        - `failed`: not paid.
        - `status_unknown`: the provider did not answer. AORA is asking it; the payment may or may not have happened. Do not retry.
        - `reconciliation_required`: the provider's information conflicts with AORA's records. An operator must review it.
      enum:
        - created
        - submitting
        - pending_provider
        - succeeded
        - failed
        - status_unknown
        - reconciliation_required
    PaymentIntent:
      type: object
      required: [id, status, amount_minor, currency, provider, failure_code, created_at, updated_at, mode]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PaymentIntentStatus' }
        amount_minor: { $ref: '#/components/schemas/AmountMinor' }
        currency: { type: string }
        provider: { type: string }
        failure_code: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    ReconciliationException:
      type: object
      required: [id, type, status, workspace_id, subject_type, subject_ref, detail, run_id, created_at]
      properties:
        id: { type: string, format: uuid }
        type:
          enum:
            - missing_internal
            - missing_at_provider
            - amount_mismatch
            - duplicate_reference
            - state_mismatch
            - stuck_status_unknown
            - ledger_mismatch
            - provider_result_conflict
        status: { enum: [open] }
        workspace_id: { type: [string, 'null'], format: uuid }
        subject_type: { type: string }
        subject_ref: { type: string }
        detail: { type: object }
        run_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error, mode]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              enum:
                - invalid_request
                - unauthenticated
                - forbidden
                - step_up_required
                - not_found
                - idempotency_key_required
                - idempotency_key_reused
                - invalid_state_transition
                - capability_not_supported
                - invalid_signature
                - too_many_attempts
                - pin_not_set
                - conflict
                - internal_error
            message: { type: string }
            request_id: { type: string }
        mode: { $ref: '#/components/schemas/Mode' }

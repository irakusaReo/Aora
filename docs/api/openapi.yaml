      responses:
        '201':
          description: Offered
          content:
            application/json:
              schema: { type: object, required: [template_key, offered], properties: { template_key: { type: string }, offered: { const: true }, mode: { $ref: '#/components/schemas/Mode' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/workspace/kelo/purchases:
    get:
      tags: [KELO]
      operationId: listKeloMerchantPurchases
      summary: Purchases of the workspace's listings, with sale, fee and net
      description: Nothing identifies the buyer.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/KeloMerchantPurchase' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/workspace/kelo/purchases/{id}/confirm:
    post:
      tags: [KELO]
      operationId: confirmKeloPurchase
      summary: Confirm a purchase whose first payment arrived
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeloMerchantPurchase' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/workspace/kelo/purchases/{id}/fulfil:
    post:
      tags: [KELO]
      operationId: fulfilKeloPurchase
      summary: Record fulfilment after the last payment; settles the merchant net of the discount fee
      description: >
        Evidence follows the category: a proof of delivery (`proof_reference`), or the session having started. Categories fulfilled on the buyer's word refuse this route.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                proof_reference: { type: string, minLength: 3, maxLength: 80 }
      responses:
        '200':
          description: Fulfilled and settled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeloMerchantPurchase' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/pay-codes:
    get:
      tags: [Workspace]
      operationId: listPayCodes
      summary: The workspace's CHIWO pay codes
      description: Permission `pay_code.read` (admin, finance, cashier). A cashier shows a code at the till.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/PayCode' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Workspace]
      operationId: createPayCode
      summary: Create a pay code a CHIWO consumer can pay
      description: >
        Permission `pay_code.manage` (admin). Eight characters with no 0, O, 1 or
        I. A code reveals only the trading name to a consumer and grants nothing.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                branch_id: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayCode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/pay-codes/{code}/deactivate:
    post:
      tags: [Workspace]
      operationId: deactivatePayCode
      summary: Stop a pay code from taking payments
      description: Permission `pay_code.manage` (admin). Idempotent.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: code, in: path, required: true, schema: { type: string, pattern: '^[2-9A-HJ-NP-Z]{8}$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayCode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/chiwo/me:
    get:
      tags: [CHIWO]
      operationId: getChiwoMe
      summary: Whether the signed-in person has a CHIWO account
      description: >
        Personal route: acts for the signed-in person only. Every CHIWO route
        refuses a request that carries `Aora-Workspace-Id` (`context_mismatch`),
        and every one except this and sign-up needs a CHIWO account
        (`sign_up_required`). Workspace membership grants nothing here.
      security: [{ session: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoMe' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/chiwo/sign-up:
    post:
      tags: [CHIWO]
      operationId: chiwoSignUp
      summary: Open a personal CHIWO account
      description: >
        Needs a phone number on file (`phone_required`) and the version of
        `chiwo_terms` in effect; records personal-capacity consent. 201 when
        created, 200 when the account already exists.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [terms_version]
              properties:
                terms_version: { type: string, minLength: 1, maxLength: 40 }
      responses:
        '200':
          description: Already signed up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoMe' }
        '201':
          description: Signed up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoMe' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/chiwo/merchants/{code}:
    get:
      tags: [CHIWO]
      operationId: getChiwoMerchant
      summary: The merchant behind a pay code
      description: Trading name only. Rate-limited per account. 404 for an unknown or inactive code.
      security: [{ session: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoMerchant' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/chiwo/payments/quote:
    post:
      tags: [CHIWO]
      operationId: quoteChiwoPayment
      summary: What paying a merchant will cost and how long it takes, before authorising
      description: >
        The consumer pays no fee (the tariff charges the merchant). In the
        sandbox the M-Pesa prompt goes to Safaricom's test number, never to the
        consumer's own phone.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pay_code, amount_minor, currency]
              properties:
                pay_code: { type: string }
                amount_minor: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoPaymentQuote' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/chiwo/payments:
    get:
      tags: [CHIWO]
      operationId: listChiwoPayments
      summary: The consumer's payments to merchants, newest first
      security: [{ session: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/ChiwoMerchantPayment' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [CHIWO]
      operationId: createChiwoPayment
      summary: Pay a KONY merchant by M-Pesa
      description: >
        Must echo the quote's fee and total (`fee_changed` otherwise). Becomes the
        merchant's collection (channel `chiwo`) with gross, fee and net from the
        tariff; the consumer's status follows it. Per-payment and per-day limits
        are data (`limit_exceeded`). The same key and body replay (200); a
        different body is refused.
      security: [{ session: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pay_code, amount_minor, currency, expected_fee_minor, expected_total_minor]
              properties:
                pay_code: { type: string }
                amount_minor: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                expected_fee_minor: { type: string, pattern: '^(0|[1-9][0-9]{0,18})$' }
                expected_total_minor: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
                sandbox_scenario: { type: string, description: 'Simulator script; sends the payment to the simulator instead of Daraja.' }
      responses:
        '200':
          description: Replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoMerchantPayment' }
        '201':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoMerchantPayment' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/chiwo/payments/{id}:
    get:
      tags: [CHIWO]
      operationId: getChiwoPayment
      summary: One of the consumer's payments
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoMerchantPayment' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/chiwo/activity:
    get:
      tags: [CHIWO]
      operationId: getChiwoActivity
      summary: Everything the consumer did, newest first
      security: [{ session: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/ChiwoActivityItem' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/chiwo/receipts/{kind}/{id}:
    get:
      tags: [CHIWO]
      operationId: getChiwoReceipt
      summary: A receipt, with parties masked
      security: [{ session: [] }]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [merchant_payment, transfer, withdrawal] } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ChiwoReceipt' }
                  - { $ref: '#/components/schemas/ChiwoTransfer' }
                  - { $ref: '#/components/schemas/ChiwoWithdrawal' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/chiwo/usdc:
    get:
      tags: [CHIWO]
      operationId: getChiwoUsdc
      summary: "Personal USDC on Base Sepolia (sandbox)"
      description: >
        Balances are a claim on AORA's sandbox testnet wallet. `deposit_address` is null where Base Sepolia is not configured; transfers between CHIWO consumers still work.
      security: [{ session: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoUsdc' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/chiwo/usdc/address-challenges:
    post:
      tags: [CHIWO]
      operationId: createChiwoAddressChallenge
      summary: "A one-time message to sign, proving an address is the consumer's own"
      security: [{ session: [] }]
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [id, message, expires_at], properties: { id: { type: string, format: uuid }, message: { type: string }, expires_at: { type: string, format: date-time }, mode: { $ref: '#/components/schemas/Mode' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/chiwo/usdc/addresses:
    post:
      tags: [CHIWO]
      operationId: registerChiwoAddress
      summary: "Register the consumer's own Base Sepolia address by signature"
      description: >
        Confirmed deposits from it are credited to this consumer only, after the confirmation policy.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, address, signature]
              properties:
                challenge_id: { type: string, format: uuid }
                address: { type: string }
                signature: { type: string }
                label: { type: string, maxLength: 60 }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoAddress' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/chiwo/usdc/withdrawals:
    post:
      tags: [CHIWO]
      operationId: createChiwoWithdrawal
      summary: "Send USDC on chain to the consumer's own registered address"
      description: >
        Needs a PIN step-up (`step_up_required`). Reserved, then signed and sent once; complete only after confirmation. Never resent while its status is unknown. Limits are data.
      security: [{ session: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_minor, address_id]
              properties:
                amount_minor: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
                address_id: { type: string, format: uuid }
      responses:
        '200':
          description: Replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoWithdrawal' }
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoWithdrawal' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/chiwo/recipients:
    get:
      tags: [CHIWO]
      operationId: listChiwoRecipients
      summary: "People the consumer can send to"
      security: [{ session: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/ChiwoRecipient' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [CHIWO]
      operationId: addChiwoRecipient
      summary: "Find a CHIWO consumer by phone number"
      description: >
        Shows a masked name only. Rate-limited, since it reveals who uses CHIWO. Unconfirmed until the sender confirms (O-11 c).
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '200':
          description: Already added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoRecipient' }
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoRecipient' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/chiwo/recipients/{id}/confirm:
    post:
      tags: [CHIWO]
      operationId: confirmChiwoRecipient
      summary: "Confirm the person shown before the first transfer to them"
      description: >
        Needs a PIN step-up (`step_up_required`).
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoRecipient' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/chiwo/transfers:
    post:
      tags: [CHIWO]
      operationId: createChiwoTransfer
      summary: "Send USDC to another CHIWO consumer"
      description: >
        Needs a PIN step-up (`step_up_required`). A ledger move on AORA's books (no chain transaction). The recipient must be confirmed (`recipient_not_confirmed`). Idempotent; limits are data.
      security: [{ session: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipient_id, amount_minor]
              properties:
                recipient_id: { type: string, format: uuid }
                amount_minor: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
                note: { type: string, maxLength: 140 }
      responses:
        '200':
          description: Replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoTransfer' }
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoTransfer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/chiwo/requests:
    get:
      tags: [CHIWO]
      operationId: listChiwoRequests
      summary: "Requests the consumer made or must pay"
      security: [{ session: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/ChiwoPaymentRequest' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [CHIWO]
      operationId: createChiwoRequest
      summary: "Ask for USDC"
      description: >
        Names a payer by phone, or none (anyone with the link may pay). Expires after the configured period.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_minor]
              properties:
                amount_minor: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
                note: { type: string, maxLength: 140 }
                payer_phone: { type: string }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoPaymentRequest' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/chiwo/requests/{id}:
    get:
      tags: [CHIWO]
      operationId: getChiwoRequest
      summary: "One request (requester, named payer, or link holder)"
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoPaymentRequest' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/chiwo/requests/{id}/cancel:
    post:
      tags: [CHIWO]
      operationId: cancelChiwoRequest
      summary: "Cancel an open request (requester only)"
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChiwoPaymentRequest' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/chiwo/requests/{id}/pay:
    post:
      tags: [CHIWO]
      operationId: payChiwoRequest
      summary: "Pay a request; it can be paid only once"
      description: >
        Needs a PIN step-up (`step_up_required`). The request is locked and must be open; a transfer can name a request once. A paid, cancelled or expired request is refused (`invalid_state_transition`).
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { allOf: [{ $ref: '#/components/schemas/ChiwoPaymentRequest' }, { type: object, required: [transfer], properties: { transfer: { $ref: '#/components/schemas/ChiwoTransfer' } } }] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: An AORA API key (`aora_sk_sandbox_…`), in place of a session token, on workspace routes only.
    session:
      type: http
      scheme: bearer
      description: The identity provider's (Clerk's) session token for the signed-in user.
    cron:
      type: http
      scheme: bearer
      description: The deployment's cron secret. Sent by the scheduler only.
  parameters:
    Workspace:
      name: Aora-Workspace-Id
      in: header
      required: true
      description: The workspace to act in. The caller must be a member.
      schema: { type: string, format: uuid }
  requestBodies:
    ChallengeAnswer:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [challenge_id, code]
            properties:
              challenge_id: { type: string }
              code: { type: string, minLength: 1, maxLength: 12 }
  responses:
    Challenge:
      description: Challenge started
      content:
        application/json:
          schema:
            type: object
            required: [challenge_id, mode]
            properties:
              challenge_id: { type: string, format: uuid }
              mode: { $ref: '#/components/schemas/Mode' }
    Received:
      description: Received
      content:
        application/json:
          schema:
            type: object
            required: [received, mode]
            properties:
              received: { const: true }
              mode: { $ref: '#/components/schemas/Mode' }
    Job:
      description: Job result
      content:
        application/json:
          schema:
            type: object
            required: [job, mode]
            properties:
              job: { type: string }
              mode: { $ref: '#/components/schemas/Mode' }
    PaymentIntent:
      description: Payment intent
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaymentIntent' }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    NamOverview:
      type: object
      required: [product, disclosure, holding, funding_pending_minor, note]
      properties:
        product:
          type: object
          properties:
            name: { type: string }
            kind: { const: smart_contract_vault }
            asset: { const: USDC }
            fee_bps: { type: integer }
            returns_claimed: { const: false }
            asset_control: { type: string }
            customer_owns: { type: string }
            withdrawal_terms: { type: string }
            vault_address: { type: string }
            network: { type: string }
        disclosure:
          type: object
          properties: { key: { const: nam_vault_disclosure }, version: { type: string }, title: { type: string }, body: { type: string } }
        holding:
          type: object
          properties:
            shares: { type: string }
            current_value_minor: { type: string, description: "The vault's convertToAssets for these shares. Not a rate." }
            cost_minor: { type: string }
        funding_pending_minor: { type: string }
        note: { type: string }
        mode: { $ref: '#/components/schemas/Mode' }
    NamOrder:
      type: object
      required: [id, amount_minor, status, created_at]
      properties:
        id: { type: string, format: uuid }
        amount_minor: { type: string }
        status: { enum: [funding_reserved, depositing, holding_confirmed, failed, reconciliation_required] }
        shares: { type: [string, 'null'] }
        tx_hash: { type: [string, 'null'], description: A hash is not completion. }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    NamRedemption:
      type: object
      required: [id, shares, status, created_at]
      properties:
        id: { type: string, format: uuid }
        shares: { type: string }
        status: { enum: [requested, redeeming, completed, failed, reconciliation_required] }
        assets_minor: { type: [string, 'null'] }
        tx_hash: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    Treasury:
      type: object
      required: [network, deposit_address, wallet_label, asset, balances, explorer_url, note]
      properties:
        network:
          type: object
          properties: { name: { const: base-sepolia }, label: { type: string }, chain_id: { const: 84532 } }
        deposit_address: { type: string, description: "AORA's sandbox testnet wallet." }
        wallet_label: { const: AORA sandbox testnet wallet }
        asset:
          type: object
          properties: { code: { const: USDC }, decimals: { type: integer }, contract: { type: string } }
        balances:
          type: object
          properties:
            available_minor: { type: string, description: USDC base units (decimals from `asset.decimals`). }
            withdrawals_in_flight_minor: { type: string }
        explorer_url: { type: string }
        note: { type: string }
        mode: { $ref: '#/components/schemas/Mode' }
    TreasuryAddress:
      type: object
      required: [id, address, status, registered_at]
      properties:
        id: { type: string, format: uuid }
        address: { type: string }
        label: { type: [string, 'null'] }
        status: { enum: [active, revoked] }
        registered_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    TreasuryTransfer:
      type: object
      required: [direction, amount_minor, currency, counterparty, status, at]
      properties:
        direction: { enum: [in, out] }
        tx_hash: { type: [string, 'null'] }
        amount_minor: { type: string }
        currency: { const: USDC }
        counterparty: { type: string }
        status: { type: string }
        at: { type: string, format: date-time }
    Withdrawal:
      type: object
      required: [id, amount_minor, currency, destination, status, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        amount_minor: { type: string }
        currency: { const: USDC }
        destination: { type: string }
        status: { enum: [requested, rejected, submitted, completed, failed, reconciliation_required] }
        created_by: { type: string, format: uuid }
        decided_by: { type: [string, 'null'], format: uuid }
        tx_hash: { type: [string, 'null'], description: A hash is not completion. }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    PayCode:
      type: object
      required: [code, branch_id, status, created_at, mode]
      properties:
        code: { type: string, pattern: '^[2-9A-HJ-NP-Z]{8}$' }
        branch_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    ChiwoMe:
      type: object
      required: [signed_up, phone_on_file, terms, mode]
      properties:
        signed_up: { type: boolean }
        phone_on_file: { type: boolean }
        terms: { type: object, required: [key, version], properties: { key: { type: string }, version: { type: string } } }
        mode: { $ref: '#/components/schemas/Mode' }
    ChiwoMerchant:
      type: object
      required: [code, trading_name, mode]
      properties:
        code: { type: string }
        trading_name: { type: string }
        mode: { $ref: '#/components/schemas/Mode' }
    ChiwoPaymentQuote:
      type: object
      required: [pay_code, amount_minor, fee_minor, total_minor, currency, rail, provider, payer_number, timing, merchant, mode]
      properties:
        pay_code: { type: string }
        amount_minor: { type: string }
        fee_minor: { type: string, description: 'What the consumer pays on top of the amount.' }
        total_minor: { type: string }
        currency: { type: string }
        rail: { type: string }
        provider: { type: string, enum: [daraja_sandbox, simulator] }
        payer_number: { const: sandbox_test_number }
        timing: { type: string }
        merchant: { $ref: '#/components/schemas/ChiwoMerchant' }
        mode: { $ref: '#/components/schemas/Mode' }
    ChiwoMerchantPayment:
      type: object
      required: [id, status, amount_minor, fee_minor, total_minor, currency, rail, merchant, created_at, updated_at, mode]
      properties:
        id: { type: string, format: uuid }
        kind: { const: merchant_payment }
        status: { type: string, enum: [submitted, being_checked, succeeded, failed, reconciliation_required] }
        amount_minor: { type: string }
        fee_minor: { type: string }
        total_minor: { type: string }
        currency: { type: string }
        rail: { type: string }
        merchant: { type: object, required: [code, trading_name], properties: { code: { type: string }, trading_name: { type: string } } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    ChiwoReceipt:
      allOf:
        - { $ref: '#/components/schemas/ChiwoMerchantPayment' }
        - type: object
          required: [kind, reference, payer_number]
          properties:
            kind: { const: merchant_payment }
            reference: { type: string }
            payer_number: { const: sandbox_test_number }
    ChiwoActivityItem:
      type: object
      required: [kind, id, direction, status, amount_minor, currency, counterparty, created_at]
      properties:
        kind: { type: string, enum: [merchant_payment, transfer, deposit, withdrawal] }
        id: { type: string }
        direction: { type: string, enum: [in, out] }
        status: { type: string }
        amount_minor: { type: string }
        currency: { type: string }
        counterparty: { type: string, description: 'A trading name, a masked person or an address.' }
        created_at: { type: string, format: date-time }
    ChiwoAddress:
      type: object
      required: [id, address, label, status, registered_at]
      properties:
        id: { type: string, format: uuid }
        address: { type: string }
        label: { type: [string, 'null'] }
        status: { type: string, enum: [active, revoked] }
        registered_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    ChiwoUsdc:
      type: object
      required: [network, deposit_address, wallet_label, asset, balances, addresses, explorer_url, note, mode]
      properties:
        network: { type: object, properties: { name: { type: string }, label: { type: string }, chain_id: { type: integer } } }
        deposit_address: { type: [string, 'null'] }
        wallet_label: { type: string }
        asset: { type: object, properties: { code: { type: string }, decimals: { type: integer }, contract: { type: string } } }
        balances: { type: object, required: [available_minor, withdrawals_in_flight_minor], properties: { available_minor: { type: string }, withdrawals_in_flight_minor: { type: string } } }
        addresses: { type: array, items: { $ref: '#/components/schemas/ChiwoAddress' } }
        explorer_url: { type: string }
        note: { type: string }
        mode: { $ref: '#/components/schemas/Mode' }
    ChiwoWithdrawal:
      type: object
      required: [id, amount_minor, currency, destination, status, tx_hash, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { const: withdrawal }
        amount_minor: { type: string }
        currency: { type: string }
        destination: { type: string }
        status: { type: string, enum: [submitted, completed, failed, reconciliation_required] }
        created_by: { type: string }
        decided_by: { type: [string, 'null'] }
        tx_hash: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    ChiwoRecipient:
      type: object
      required: [id, display_name, confirmed]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, description: 'Masked: never the full name or number.' }
        confirmed: { type: boolean }
        mode: { $ref: '#/components/schemas/Mode' }
    ChiwoTransfer:
      type: object
      required: [id, kind, direction, status, amount_minor, fee_minor, currency, counterparty, note, request_id, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { const: transfer }
        direction: { type: string, enum: [in, out] }
        status: { const: posted }
        amount_minor: { type: string }
        fee_minor: { type: string }
        currency: { type: string }
        counterparty: { type: string }
        note: { type: [string, 'null'] }
        request_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    ChiwoPaymentRequest:
      type: object
      required: [id, role, status, amount_minor, currency, note, requester, payer, expires_at, paid_transfer_id, created_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [requester, payer, link] }
        status: { type: string, enum: [open, paid, cancelled, expired] }
        amount_minor: { type: string }
        currency: { type: string }
        note: { type: [string, 'null'] }
        requester: { type: object, properties: { display_name: { type: string } } }
        payer: { type: [object, 'null'], properties: { display_name: { type: string } } }
        expires_at: { type: string, format: date-time }
        paid_transfer_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    Mode:
      const: sandbox
      description: Every record and response is sandbox data.
    Role:
      enum: [admin, finance, cashier]
    Member:
      type: object
      required: [id, account_id, role, status, branch_id, phone_hint]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        status: { enum: [active, removed] }
        branch_id: { type: [string, 'null'], format: uuid }
        display_name: { type: [string, 'null'] }
        email_masked: { type: string, description: First letter and domain of the member's email address. }
        phone_hint: { type: string, description: Last three digits of the member's phone number. }
        mode: { $ref: '#/components/schemas/Mode' }
    Workspace:
      type: object
      required: [id, name, kind, country, tier, restrictions, limits]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { enum: [registered, unregistered] }
        country: { type: string }
        tier: { type: string }
        restrictions:
          description: Active restrictions, lifted only by an operator.
          type: array
          items: { enum: [payouts_suspended, listing_suspended] }
        limits:
          type: array
          items:
            type: object
            required: [currency, per_transaction_max_minor, daily_collection_max_minor, daily_payout_max_minor]
            properties:
              currency: { type: string }
              per_transaction_max_minor: { $ref: '#/components/schemas/AmountMinor' }
              daily_collection_max_minor: { $ref: '#/components/schemas/AmountMinor' }
              daily_payout_max_minor: { $ref: '#/components/schemas/FeeMinor' }
        mode: { $ref: '#/components/schemas/Mode' }
    Invitation:
      type: object
      required: [id, email, role, branch_id, status, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        branch_id: { type: [string, 'null'], format: uuid }
        status: { enum: [pending, accepted, revoked, expired] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    MyInvitation:
      type: object
      required: [id, workspace_id, workspace_name, role, expires_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        expires_at: { type: string, format: date-time }
    KeloVariant:
      type: object
      required: [id, name, price_minor, stock_on_hand, stock_reserved]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price_minor: { $ref: '#/components/schemas/AmountMinor' }
        stock_on_hand: { type: integer }
        stock_reserved: { type: integer }
        mode: { $ref: '#/components/schemas/Mode' }
    KeloSession:
      type: object
      required: [id, starts_at, price_minor, capacity, reserved]
      properties:
        id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        price_minor: { $ref: '#/components/schemas/AmountMinor' }
        capacity: { type: integer }
        reserved: { type: integer }
        mode: { $ref: '#/components/schemas/Mode' }
    KeloListing:
      type: object
      required: [id, status, category, type, title, description, currency, revision, variants, sessions, images, published_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        status: { enum: [draft, in_review, published, rejected, suspended] }
        category: { type: string }
        type: { enum: [stock_item, scheduled_service, quote_service] }
        title: { type: string }
        description: { type: string }
        currency: { type: string }
        revision: { type: integer }
        variants: { type: array, items: { $ref: '#/components/schemas/KeloVariant' } }
        sessions: { type: array, items: { $ref: '#/components/schemas/KeloSession' } }
        images:
          type: array
          items: { type: object, properties: { id: { type: string }, url: { type: string }, content_type: { type: string }, size_bytes: { type: integer } } }
        published_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    KeloListingSummary:
      type: object
      required: [id, title, category, type, currency, store_name, from_price_minor, image_url]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { type: string }
        type: { enum: [stock_item, scheduled_service, quote_service] }
        currency: { type: string }
        store_name: { type: string }
        from_price_minor: { type: [string, 'null'], description: The lowest current price; null for a quote-based service. }
        image_url: { type: [string, 'null'] }
    KeloPublicListing:
      type: object
      required: [id, title, description, category, type, currency, store, from_price_minor, variants, sessions, images]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        type: { enum: [stock_item, scheduled_service, quote_service] }
        currency: { type: string }
        store: { type: object, properties: { display_name: { type: string } } }
        from_price_minor: { type: [string, 'null'] }
        variants:
          type: array
          items: { type: object, properties: { id: { type: string }, name: { type: string }, price_minor: { type: string }, in_stock: { type: boolean } } }
        sessions:
          type: array
          items: { type: object, properties: { id: { type: string }, starts_at: { type: string, format: date-time }, price_minor: { type: string }, available: { type: boolean } } }
        images: { type: array, items: { type: object, properties: { url: { type: string } } } }
        mode: { $ref: '#/components/schemas/Mode' }
    KeloQuote:
      type: object
      required: [id, price_minor, currency, expires_at, status, created_at]
      properties:
        id: { type: string, format: uuid }
        price_minor: { $ref: '#/components/schemas/AmountMinor' }
        currency: { type: string }
        expires_at: { type: string, format: date-time }
        status: { enum: [offered, accepted, declined, expired] }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    KeloQuoteRequest:
      type: object
      required: [id, listing_id, listing_title, details, status, quotes, created_at]
      properties:
        id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        listing_title: { type: string }
        details: { type: string }
        status: { enum: [open, quoted, accepted, withdrawn] }
        quotes: { type: array, items: { $ref: '#/components/schemas/KeloQuote' } }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    KeloPlan:
      type: object
      required: [template_key, name, plan_type, instalments, total_minor, fees_minor, currency, receive_after_last_payment, cancellation, terms]
      properties:
        template_key: { type: string }
        name: { type: string }
        plan_type: { const: layaway }
        instalments:
          type: array
          items: { type: object, required: [seq, due_on, amount_minor], properties: { seq: { type: integer }, due_on: { type: string, format: date }, amount_minor: { $ref: '#/components/schemas/AmountMinor' } } }
        total_minor: { $ref: '#/components/schemas/AmountMinor' }
        fees_minor: { type: string, description: 'Charged to the buyer on top of the price. Layaway: always "0".' }
        currency: { type: string }
        receive_after_last_payment: { const: true }
        cancellation:
          type: object
          properties:
            fee_bps: { type: integer }
            fee_cap_minor: { type: string }
            after_start_returned_bps: { type: integer }
        terms: { type: object, properties: { key: { type: string }, version: { type: string } } }
    KeloPurchase:
      type: object
      required: [id, status, plan_status, plan_type, listing_id, listing_title, total_minor, paid_minor, currency, receive_after_last_payment, instalments, refund, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { enum: [placed, payment_ready, merchant_confirmed, fulfilled, completed, cancelled] }
        plan_status: { enum: [active, paid_in_full, settled, cancelled, refunded] }
        plan_type: { const: layaway }
        listing_id: { type: string, format: uuid }
        listing_title: { type: string }
        total_minor: { $ref: '#/components/schemas/AmountMinor' }
        paid_minor: { type: string }
        currency: { type: string }
        receive_after_last_payment: { const: true }
        instalments:
          type: array
          items: { type: object, properties: { seq: { type: integer }, due_on: { type: string, format: date }, amount_minor: { type: string }, status: { enum: [due, pending, paid, cancelled] } } }
        refund:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                paid_minor: { type: string }
                fee_minor: { type: string }
                refund_minor: { type: string }
                status: { enum: [requested, pending_provider, succeeded, failed, status_unknown, reconciliation_required] }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    KeloMerchantPurchase:
      type: object
      required: [id, status, plan_status, listing_title, total_minor, paid_minor, merchant_fee_minor, net_minor, currency, next_action, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { enum: [placed, payment_ready, merchant_confirmed, fulfilled, completed, cancelled] }
        plan_status: { enum: [active, paid_in_full, settled, cancelled, refunded] }
        listing_title: { type: string }
        total_minor: { type: string }
        paid_minor: { type: string }
        merchant_fee_minor: { type: string }
        net_minor: { type: string }
        currency: { type: string }
        next_action: { enum: [wait_for_payments, confirm, fulfil, wait_for_buyer, none] }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    KeloStore:
      type: object
      required: [id, status, display_name, categories, workspace_id, provisioning_status, decision_reason, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        status: { enum: [submitted, approved, rejected] }
        display_name: { type: string }
        categories: { type: array, items: { type: string } }
        workspace_id: { type: [string, 'null'], format: uuid, description: The linked KONY workspace, once provisioning has linked it. }
        provisioning_status: { oneOf: [{ $ref: '#/components/schemas/KeloProvisioningStatus' }, { type: 'null' }] }
        decision_reason: { type: [string, 'null'], description: Shown only for a rejected store. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    KeloStoreForVetting:
      allOf:
        - { $ref: '#/components/schemas/KeloStore' }
        - type: object
          properties:
            categories:
              type: array
              items:
                type: object
                required: [slug, name, version, requirements]
                properties:
                  slug: { type: string }
                  name: { type: string }
                  version: { type: integer }
                  requirements: { type: array, items: { type: string } }
            applicant_account_id: { type: string, format: uuid }
            existing_workspace_id: { type: [string, 'null'], format: uuid }
            verification: { type: [string, 'null'] }
            restrictions: { type: array, items: { type: string } }
    KeloProvisioningStatus:
      description: ADR 0008. `failed_needs_review` and `reconciliation_required` wait for an operator.
      enum: [requested, business_resolved, workspace_linked, admin_assigned, completed, failed_retryable, failed_needs_review, reconciliation_required]
    KeloProvisioning:
      type: object
      required: [id, store_id, status, last_step, reason, business_id, workspace_id, attempts, updated_at]
      properties:
        id: { type: string, format: uuid }
        store_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/KeloProvisioningStatus' }
        last_step: { enum: [requested, business_resolved, workspace_linked, admin_assigned, completed] }
        reason: { type: [string, 'null'], description: A reason code. }
        business_id: { type: [string, 'null'], format: uuid }
        workspace_id: { type: [string, 'null'], format: uuid }
        attempts: { type: integer }
        updated_at: { type: string, format: date-time }
    OnboardingApplication:
      type: object
      required: [id, status, kind, name, country, workspace_id, decision_reason, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        status:
          description: |
            - `submitted`: received, not yet matched.
            - `needs_review`: a possible duplicate; an operator decides. Nothing has been created.
            - `approved`: the business, its workspace and the applicant's admin membership exist.
            - `rejected`: final; `decision_reason` says why.
          enum: [submitted, needs_review, approved, rejected]
        kind: { enum: [registered, unregistered] }
        name: { type: string }
        country: { type: string }
        workspace_id: { type: [string, 'null'], format: uuid }
        decision_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    ReceivedBody:
      type: object
      required: [received]
      properties:
        received: { const: true }
        mode: { $ref: '#/components/schemas/Mode' }
    Settlement:
      type: object
      required: [id, currency, gross_minor, fee_minor, net_minor, collections, created_at]
      properties:
        id: { type: string, format: uuid }
        currency: { type: string }
        gross_minor: { $ref: '#/components/schemas/AmountMinor' }
        fee_minor: { $ref: '#/components/schemas/FeeMinor' }
        net_minor: { $ref: '#/components/schemas/FeeMinor' }
        collections: { type: integer }
        created_at: { type: string, format: date-time }
    PayoutRecipient:
      type: object
      required: [id, label, rail, status, phone_hint, confirmed_at, created_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        rail: { type: string }
        status: { enum: [unconfirmed, confirmed, disabled] }
        phone_hint: { type: string, description: Last three digits only. }
        confirmed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        confirmation_proves: { type: string, description: What confirming proves (intent, not ownership). }
        mode: { $ref: '#/components/schemas/Mode' }
    OperationStatus:
      description: Same meanings as PaymentIntentStatus.
      enum: [created, submitting, pending_provider, succeeded, failed, status_unknown, reconciliation_required]
    Payout:
      type: object
      required: [id, status, recipient_id, amount_minor, fee_minor, total_minor, currency, tariff_version_id, provider, failure_code, receipt, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OperationStatus' }
        recipient_id: { type: string, format: uuid }
        amount_minor: { $ref: '#/components/schemas/AmountMinor' }
        fee_minor: { $ref: '#/components/schemas/FeeMinor' }
        total_minor: { $ref: '#/components/schemas/AmountMinor' }
        currency: { type: string }
        tariff_version_id: { type: string, format: uuid }
        provider: { type: string }
        failure_code: { type: [string, 'null'] }
        receipt: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    Refund:
      type: object
      required: [id, status, payment_intent_id, amount_minor, currency, provider, failure_code, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OperationStatus' }
        payment_intent_id: { type: string, format: uuid }
        amount_minor: { $ref: '#/components/schemas/AmountMinor' }
        currency: { type: string }
        provider: { type: string }
        failure_code: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    ApiKey:
      type: object
      required: [id, name, prefix, scope, created_at, last_used_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: The first characters of the key, to tell keys apart. }
        scope: { enum: [collect, full] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    WebhookEndpoint:
      type: object
      required: [id, url, event_types, status, created_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        event_types: { type: array, items: { enum: [payment_intent.succeeded, payment_intent.failed, payout.succeeded, payout.failed, refund.succeeded, refund.failed] } }
        status: { enum: [active, disabled] }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    WebhookDelivery:
      type: object
      required: [id, event_id, event_type, endpoint_id, status, attempts, last_response_status, replay_of, created_at, delivered_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        event_type: { type: string }
        endpoint_id: { type: string, format: uuid }
        status: { enum: [pending, delivered, dead] }
        attempts: { type: integer }
        last_response_status: { type: [integer, 'null'] }
        replay_of: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
    Branch:
      type: object
      required: [id, name, status, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { enum: [active, closed] }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    FeeMinor:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: Integer amount in the currency's minor units, as a string. May be zero.
    AmountMinor:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: Integer amount in the currency's minor units, as a string.
      examples: ['15000']
    PaymentIntentStatus:
      description: |
        - `created`: accepted by AORA, not yet sent to the provider.
        - `submitting`: being sent to the provider.
        - `pending_provider`: accepted by the provider, awaiting its result.
        - `succeeded`: paid, and recorded in the ledger.
        - `failed`: not paid.
        - `status_unknown`: the provider did not answer. AORA is asking it; the payment may or may not have happened. Do not retry.
        - `reconciliation_required`: the provider's information conflicts with AORA's records. An operator must review it.
      enum:
        - created
        - submitting
        - pending_provider
        - succeeded
        - failed
        - status_unknown
        - reconciliation_required
    PaymentIntent:
      type: object
      required:
        - id
        - status
        - amount_minor
        - fee_minor
        - net_minor
        - tariff_version_id
        - currency
        - rail
        - branch_id
        - reference
        - provider
        - failure_code
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PaymentIntentStatus' }
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
          description: Gross, what the payer pays.
        fee_minor:
          $ref: '#/components/schemas/FeeMinor'
          description: AORA's fee, fixed when the collection was created.
        net_minor:
          $ref: '#/components/schemas/FeeMinor'
          description: What the merchant receives. Always gross minus fee.
        tariff_version_id:
          type: [string, 'null']
          format: uuid
          description: The tariff version the fee was calculated from.
        currency: { type: string }
        rail: { type: string }
        branch_id: { type: [string, 'null'], format: uuid }
        reference: { type: [string, 'null'] }
        provider: { type: string }
        failure_code: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    ReconciliationException:
      type: object
      required: [id, type, status, workspace_id, subject_type, subject_ref, detail, run_id, created_at]
      properties:
        id: { type: string, format: uuid }
        type:
          enum:
            - missing_internal
            - missing_at_provider
            - amount_mismatch
            - duplicate_reference
            - state_mismatch
            - stuck_status_unknown
            - ledger_mismatch
            - provider_result_conflict
        status: { enum: [open, resolved] }
        resolution: { enum: [corrected, accepted, false_positive, null] }
        resolution_reason: { type: [string, 'null'] }
        resolved_by: { type: [string, 'null'], format: uuid }
        resolved_at: { type: [string, 'null'], format: date-time }
        workspace_id: { type: [string, 'null'], format: uuid }
        subject_type: { type: string }
        subject_ref: { type: string }
        detail: { type: object }
        run_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error, mode]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              enum:
                - invalid_request
                - unauthenticated
                - forbidden
                - step_up_required
                - reverification_required
                - not_found
                - idempotency_key_required
                - idempotency_key_reused
                - invalid_state_transition
                - capability_not_supported
                - limit_exceeded
                - insufficient_funds
                - fee_changed
                - recipient_not_confirmed
                - recipient_cooling_off
                - refund_exceeds_collection
                - invalid_signature
                - too_many_attempts
                - pin_not_set
                - phone_required
                - workspace_restricted
                - prohibited_item
                - sold_out
                - conflict
                - invalid_destination
                - chain_unavailable
                - context_mismatch
                - sign_up_required
                - internal_error
            message: { type: string }
            request_id: { type: string }
        mode: { $ref: '#/components/schemas/Mode' }

        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/kelo/me/purchases/{id}/instalments/{seq}/pay:
    post:
      tags: [KELO]
      operationId: payKeloInstalment
      summary: Start paying the next instalment
      description: >
        Instalments are paid in order. The instalment is claimed for this request before any payment exists, so a second request never pushes a second payment. While a payment's result is unknown the instalment is `pending` and cannot be paid again. On the M-Pesa rail, the sandbox accepts only the Daraja test number.
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: seq, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sandbox_scenario: { type: string, description: Sandbox only. Scripts the simulator. }
                payer_phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
      responses:
        '202':
          description: Payment started
          content:
            application/json:
              schema: { type: object, required: [seq, status, payment_intent_id], properties: { seq: { type: integer }, status: { const: pending }, payment_intent_id: { type: string, format: uuid }, mode: { $ref: '#/components/schemas/Mode' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

openapi: 3.1.0
info:
  title: AORA API
  version: 0.1.0
  summary: SANDBOX ONLY. No real money moves through this API.
  description: |
    Sign-in is handled by the identity provider (Clerk): clients send its session
    token as a bearer token. This API covers the transaction PIN and step-up, workspace
    members and balances, consent records, collection payment intents against
    the AORA simulator provider, simulator webhook intake, operator
    reconciliation endpoints and scheduler-triggered jobs.

    Conventions:
    - Every response carries the header `Aora-Mode: sandbox`, and every JSON
      object body carries `"mode": "sandbox"`.
    - Every response carries `Aora-Request-Id`.
    - Amounts are strings of digits in minor units, for example `"15000"` for
      KES 150.00. JSON numbers are rejected.
    - `POST` requests that create a financial operation require an
      `Idempotency-Key` header. The same key with the same body returns the
      original result with status 200 and `Idempotent-Replay: true`. The same
      key with a different body returns 409.
    - Error codes are stable. Changing or removing one is a breaking change.
servers:
  - url: http://127.0.0.1:3000
    description: Local sandbox
tags:
  - name: Health
  - name: Auth
  - name: Workspace
  - name: Consent
  - name: Payment intents
  - name: Webhooks
  - name: Notifications
  - name: KELO
  - name: CHIWO
  - name: Operations
  - name: Internal
paths:
  /v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and database check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, database, chain, mode]
                properties:
                  status: { const: ok }
                  database: { const: ok }
                  chain:
                    type: string
                    description: >
                      Base Sepolia startup verification (ADR 0004): `verified`,
                      `unverified` (not yet checked by this instance),
                      `failed:<reason>` (every chain feature refuses; reasons
                      `rpc_unreachable`, `wrong_chain`, `no_token_code`,
                      `wrong_decimals`, `ledger_exponent_mismatch`), or
                      `not_configured`.
                    examples: [verified, not_configured, 'failed:wrong_chain']
                  mode: { $ref: '#/components/schemas/Mode' }
  /v1/me/phone:
    put:
      tags: [Auth]
      operationId: setPhone
      summary: Set the account's phone number (payment identifier)
      description: >
        The phone number is the account's payment identifier and financial
        identity. It is held by AORA, not by the identity provider, and is not a
        sign-in credential. It is stored unverified. A number can belong to one
        account only. Setting it the first time needs no step-up; replacing an
        existing number needs a PIN step-up.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
      responses:
        '200':
          description: Phone number stored
          content:
            application/json:
              schema:
                type: object
                required: [phone_hint, phone_verified, mode]
                properties:
                  phone_hint: { type: string, description: Last three digits, masked. }
                  phone_verified: { type: boolean }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/auth/pin:
    put:
      tags: [Auth]
      operationId: setPin
      summary: Set or change the transaction PIN
      description: >
        Allowed only on a session whose sign-in factor was verified in the last
        few minutes; otherwise `reverification_required` is returned and the
        client should ask the user to confirm their sign-in again. The PIN is six
        digits and may not be a repeated digit or a simple sequence.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pin]
              properties:
                pin: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: PIN set
          content:
            application/json:
              schema:
                type: object
                required: [pin_set, mode]
                properties:
                  pin_set: { const: true }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/auth/step-up:
    post:
      tags: [Auth]
      operationId: completeStepUp
      summary: Confirm a sensitive action with the PIN
      description: >
        Sensitive actions require a step-up completed within the last few minutes
        on the same sign-in session. After repeated wrong PINs the PIN is locked for a
        while; it can be replaced after confirming sign-in again.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pin]
              properties:
                pin: { type: string }
      responses:
        '200':
          description: Step-up recorded
          content:
            application/json:
              schema:
                type: object
                required: [step_up_until, mode]
                properties:
                  step_up_until: { type: string, format: date-time }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/assets:
    get:
      tags: [Identity]
      operationId: listAssets
      summary: Assets and the number of minor-unit digits of each
      description: Public reference data (the KELO marketplace shows prices before sign-in). Screens use the exponent to show and read amounts; nothing assumes two decimal places.
      security: []
      responses:
        '200':
          description: Assets
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [code, kind, exponent]
                      properties:
                        code: { type: string }
                        kind: { enum: [fiat, token] }
                        exponent: { type: integer, minimum: 0, maximum: 18 }
                  mode: { $ref: '#/components/schemas/Mode' }
  /v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The signed-in account and its workspace memberships
      security: [{ session: [] }]
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                type: object
                required: [account_id, is_platform_operator, memberships, mode]
                properties:
                  account_id: { type: string, format: uuid }
                  is_platform_operator: { type: boolean }
                  memberships:
                    type: array
                    items:
                      type: object
                      required: [workspace_id, role]
                      properties:
                        workspace_id: { type: string, format: uuid }
                        role: { enum: [admin, finance, cashier] }
                  phone_set:
                    type: boolean
                    description: Whether the account has a phone number. The number itself is never returned here.
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/payment-intents:
    get:
      tags: [Payment intents]
      operationId: listPaymentIntents
      summary: List collections, newest first
      description: >
        Roles: admin, finance, cashier. A cashier sees only the collections of
        their own branch. Each item shows gross, fee and net.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string }, description: The `next_cursor` of the previous page. }
      responses:
        '200':
          description: One page of collections
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, mode]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PaymentIntent' } }
                  next_cursor: { type: [string, 'null'] }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Payment intents]
      operationId: createPaymentIntent
      summary: Create a collection payment intent
      description: >
        Roles: admin, finance, cashier. The intent is submitted to the provider
        asynchronously; poll `GET /v1/payment-intents/{id}` for its status.
        The fee is fixed now, from the tariff version in effect, and returned
        with the net amount. A cashier's collection always belongs to their own
        branch. Answers `limit_exceeded` (422) above the workspace tier's limits.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_minor, currency]
              properties:
                amount_minor: { $ref: '#/components/schemas/AmountMinor' }
                currency: { type: string, pattern: '^[A-Z]{3}$', examples: [KES] }
                rail: { type: string, pattern: '^[a-z][a-z0-9_]{1,30}$', default: mpesa }
                branch_id: { type: string, format: uuid }
                reference:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: The merchant's own label for the sale, such as an order or counter.
                payer_phone:
                  type: string
                  pattern: '^\+[1-9][0-9]{7,14}$'
                  description: >
                    The payer's M-Pesa number. Required when the collection goes to Daraja
                    (rail mpesa, no sandbox_scenario). In the sandbox only the Daraja test
                    number is accepted. Kept by the adapter; never returned.
                sandbox_scenario:
                  description: Sandbox only. Makes the simulator provider behave in a chosen way.
                  enum:
                    - success
                    - decline
                    - timeout_then_success
                    - timeout_then_failure
                    - duplicate_webhook
                    - late_webhook
                    - amount_mismatch
                    - missing_settlement_line
      responses:
        '201': { $ref: '#/components/responses/PaymentIntent' }
        '200':
          description: Replay of an earlier request with the same key and body
          headers:
            Idempotent-Replay: { schema: { const: 'true' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/payment-intents/{id}:
    get:
      tags: [Payment intents]
      operationId: getPaymentIntent
      summary: Status lookup for a payment intent
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/PaymentIntent' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/tariffs/quote:
    get:
      tags: [Payment intents]
      operationId: quoteTariff
      summary: Gross, fee and net for an amount, under the tariff in effect now
      description: 'Permission: `tariff.read` (admin, finance, cashier). Changes nothing.'
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: operation, in: query, required: true, schema: { enum: [collection] } }
        - { name: rail, in: query, required: true, schema: { type: string } }
        - { name: currency, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: amount_minor, in: query, required: true, schema: { $ref: '#/components/schemas/AmountMinor' } }
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema:
                type: object
                required: [amount_minor, fee_minor, net_minor, tariff_version_id, tariff_version, mode]
                properties:
                  amount_minor: { $ref: '#/components/schemas/AmountMinor' }
                  fee_minor: { $ref: '#/components/schemas/FeeMinor' }
                  net_minor: { $ref: '#/components/schemas/FeeMinor' }
                  tariff_version_id: { type: string, format: uuid }
                  tariff_version: { type: integer }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/webhooks/daraja/stk/{intentId}/{token}:
    post:
      tags: [Webhooks]
      operationId: receiveDarajaStkCallback
      summary: Daraja M-Pesa Express result (sandbox)
      description: >
        Called by Safaricom Daraja. Daraja documents no signature, so the URL
        carries a per-operation token. A callback never moves money by itself:
        it prompts a status query, and only the query's answer is applied (ADR 0022).
      parameters:
        - { name: intentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Received' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/webhooks/sandbox:
    post:
      tags: [Webhooks]
      operationId: receiveSandboxWebhook
      summary: Webhook intake for the AORA simulator provider
      description: >
        Authenticated by an HMAC-SHA-256 signature over the raw body, not by a
        session. Duplicate deliveries are accepted and have no further effect.
      parameters:
        - name: Aora-Sim-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, type, operation_ref, provider_reference, result, amount_minor, asset]
              properties:
                event_id: { type: string }
                type: { const: collection.result }
                operation_ref: { type: string }
                provider_reference: { type: string }
                result: { enum: [succeeded, failed] }
                amount_minor: { $ref: '#/components/schemas/AmountMinor' }
                asset: { type: string }
      responses:
        '200':
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [received, mode]
                properties:
                  received: { const: true }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/ops/reconciliation-runs:
    post:
      tags: [Operations]
      operationId: runReconciliation
      summary: Run reconciliation now
      description: >
        Platform operators only. Compares the provider's settlement report with
        payment intents and the ledger and records differences. Corrects nothing.
      security: [{ session: [] }]
      responses:
        '201':
          description: Run finished
          content:
            application/json:
              schema:
                type: object
                required: [run_id, lines_checked, intents_checked, exceptions_opened, mode]
                properties:
                  run_id: { type: string, format: uuid }
                  lines_checked: { type: integer }
                  intents_checked: { type: integer }
                  exceptions_opened: { type: integer }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/ops/reconciliation-exceptions:
    get:
      tags: [Operations]
      operationId: listReconciliationExceptions
      summary: List reconciliation exceptions, newest first
      security: [{ session: [] }]
      parameters:
        - { name: status, in: query, schema: { enum: [open, resolved] } }
      responses:
        '200':
          description: Exceptions
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReconciliationException' }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/ops/reconciliation-exceptions/{id}:
    get:
      tags: [Operations]
      operationId: getReconciliationException
      summary: Inspect one reconciliation exception
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Exception
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationException' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/workspace/members:
    get:
      tags: [Workspace]
      operationId: listMembers
      summary: List the workspace's members
      description: 'Permission: `member.read` (admin, finance).'
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Member' } }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/workspace/members/{id}:
    patch:
      tags: [Workspace]
      operationId: updateMember
      summary: Change a member's role, or remove them
      description: >
        Permission: `member.manage` (admin). Requires a PIN step-up. Send exactly
        one of `role`, `status` or `branch_id` (null clears the branch). A
        workspace always keeps at least one active admin.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { $ref: '#/components/schemas/Role' }
                status: { const: removed }
                branch_id: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/workspace/branches:
    get:
      tags: [Workspace]
      operationId: listBranches
      summary: List the workspace's branches
      description: 'Permission: `branch.read` (admin, finance, cashier).'
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Branch' } }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Workspace]
      operationId: createBranch
      summary: Add a branch
      description: 'Permission: `branch.manage` (admin). Names are unique in a workspace.'
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Branch added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/workspace/branches/{id}:
    patch:
      tags: [Workspace]
      operationId: updateBranch
      summary: Rename, close or reopen a branch
      description: 'Permission: `branch.manage` (admin). A closed branch takes no new collections.'
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                status: { enum: [active, closed] }
      responses:
        '200':
          description: Branch updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/workspace:
    get:
      tags: [Workspace]
      operationId: getWorkspace
      summary: The workspace, its tier and what the tier allows
      description: >
        Permission: `workspace.read` (admin, finance, cashier). Limits are sandbox values.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/workspace/invitations:
    get:
      tags: [Workspace]
      operationId: listInvitations
      summary: List the workspace's invitations
      description: >
        Permission: `member.read` (admin, finance).
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Invitation' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Workspace]
      operationId: createInvitation
      summary: Invite a person by email address
      description: >
        Permission: `member.manage` (admin). Requires a PIN step-up. Nothing is granted until the person signs in with that address and accepts. No email can accept on their behalf.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                role: { $ref: '#/components/schemas/Role' }
                branch_id: { type: string, format: uuid }
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/Error' }

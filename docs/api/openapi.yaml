openapi: 3.1.0
info:
  title: AORA API
  version: 0.1.0
  summary: SANDBOX ONLY. No real money moves through this API.
  description: |
    Sign-in is handled by the identity provider (Clerk): clients send its session
    token as a bearer token. This API covers the transaction PIN and step-up, workspace
    members and balances, consent records, collection payment intents against
    the AORA simulator provider, simulator webhook intake, operator
    reconciliation endpoints and scheduler-triggered jobs.

    Conventions:
    - Every response carries the header `Aora-Mode: sandbox`, and every JSON
      object body carries `"mode": "sandbox"`.
    - Every response carries `Aora-Request-Id`.
    - Amounts are strings of digits in minor units, for example `"15000"` for
      KES 150.00. JSON numbers are rejected.
    - `POST` requests that create a financial operation require an
      `Idempotency-Key` header. The same key with the same body returns the
      original result with status 200 and `Idempotent-Replay: true`. The same
      key with a different body returns 409.
    - Error codes are stable. Changing or removing one is a breaking change.
servers:
  - url: http://127.0.0.1:3000
    description: Local sandbox
tags:
  - name: Health
  - name: Auth
  - name: Workspace
  - name: Consent
  - name: Payment intents
  - name: Webhooks
  - name: Notifications
  - name: Operations
  - name: Internal
paths:
  /v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and database check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, database, mode]
                properties:
                  status: { const: ok }
                  database: { const: ok }
                  mode: { $ref: '#/components/schemas/Mode' }
  /v1/me/phone:
    put:
      tags: [Auth]
      operationId: setPhone
      summary: Set the account's phone number (payment identifier)
      description: >
        The phone number is the account's payment identifier and financial
        identity. It is held by AORA, not by the identity provider, and is not a
        sign-in credential. It is stored unverified. A number can belong to one
        account only. Setting it the first time needs no step-up; replacing an
        existing number needs a PIN step-up.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
      responses:
        '200':
          description: Phone number stored
          content:
            application/json:
              schema:
                type: object
                required: [phone_hint, phone_verified, mode]
                properties:
                  phone_hint: { type: string, description: Last three digits, masked. }
                  phone_verified: { type: boolean }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/auth/pin:
    put:
      tags: [Auth]
      operationId: setPin
      summary: Set or change the transaction PIN
      description: >
        Allowed only on a session whose sign-in factor was verified in the last
        few minutes; otherwise `reverification_required` is returned and the
        client should ask the user to confirm their sign-in again. The PIN is six
        digits and may not be a repeated digit or a simple sequence.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pin]
              properties:
                pin: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: PIN set
          content:
            application/json:
              schema:
                type: object
                required: [pin_set, mode]
                properties:
                  pin_set: { const: true }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/auth/step-up:
    post:
      tags: [Auth]
      operationId: completeStepUp
      summary: Confirm a sensitive action with the PIN
      description: >
        Sensitive actions require a step-up completed within the last few minutes
        on the same sign-in session. After repeated wrong PINs the PIN is locked for a
        while; it can be replaced after confirming sign-in again.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pin]
              properties:
                pin: { type: string }
      responses:
        '200':
          description: Step-up recorded
          content:
            application/json:
              schema:
                type: object
                required: [step_up_until, mode]
                properties:
                  step_up_until: { type: string, format: date-time }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The signed-in account and its workspace memberships
      security: [{ session: [] }]
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                type: object
                required: [account_id, is_platform_operator, memberships, mode]
                properties:
                  account_id: { type: string, format: uuid }
                  is_platform_operator: { type: boolean }
                  memberships:
                    type: array
                    items:
                      type: object
                      required: [workspace_id, role]
                      properties:
                        workspace_id: { type: string, format: uuid }
                        role: { enum: [admin, finance, cashier] }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/payment-intents:
    get:
      tags: [Payment intents]
      operationId: listPaymentIntents
      summary: List collections, newest first
      description: >
        Roles: admin, finance, cashier. A cashier sees only the collections of
        their own branch. Each item shows gross, fee and net.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string }, description: The `next_cursor` of the previous page. }
      responses:
        '200':
          description: One page of collections
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, mode]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PaymentIntent' } }
                  next_cursor: { type: [string, 'null'] }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Payment intents]
      operationId: createPaymentIntent
      summary: Create a collection payment intent
      description: >
        Roles: admin, finance, cashier. The intent is submitted to the provider
        asynchronously; poll `GET /v1/payment-intents/{id}` for its status.
        The fee is fixed now, from the tariff version in effect, and returned
        with the net amount. A cashier's collection always belongs to their own
        branch. Answers `limit_exceeded` (422) above the workspace tier's limits.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_minor, currency]
              properties:
                amount_minor: { $ref: '#/components/schemas/AmountMinor' }
                currency: { type: string, pattern: '^[A-Z]{3}$', examples: [KES] }
                rail: { type: string, pattern: '^[a-z][a-z0-9_]{1,30}$', default: mpesa }
                branch_id: { type: string, format: uuid }
                reference:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: The merchant's own label for the sale, such as an order or counter.
                sandbox_scenario:
                  description: Sandbox only. Makes the simulator provider behave in a chosen way.
                  enum:
                    - success
                    - decline
                    - timeout_then_success
                    - timeout_then_failure
                    - duplicate_webhook
                    - late_webhook
                    - amount_mismatch
                    - missing_settlement_line
      responses:
        '201': { $ref: '#/components/responses/PaymentIntent' }
        '200':
          description: Replay of an earlier request with the same key and body
          headers:
            Idempotent-Replay: { schema: { const: 'true' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/payment-intents/{id}:
    get:
      tags: [Payment intents]
      operationId: getPaymentIntent
      summary: Status lookup for a payment intent
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/PaymentIntent' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/tariffs/quote:
    get:
      tags: [Payment intents]
      operationId: quoteTariff
      summary: Gross, fee and net for an amount, under the tariff in effect now
      description: 'Permission: `tariff.read` (admin, finance, cashier). Changes nothing.'
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: operation, in: query, required: true, schema: { enum: [collection] } }
        - { name: rail, in: query, required: true, schema: { type: string } }
        - { name: currency, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: amount_minor, in: query, required: true, schema: { $ref: '#/components/schemas/AmountMinor' } }
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema:
                type: object
                required: [amount_minor, fee_minor, net_minor, tariff_version_id, tariff_version, mode]
                properties:
                  amount_minor: { $ref: '#/components/schemas/AmountMinor' }
                  fee_minor: { $ref: '#/components/schemas/FeeMinor' }
                  net_minor: { $ref: '#/components/schemas/FeeMinor' }
                  tariff_version_id: { type: string, format: uuid }
                  tariff_version: { type: integer }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/webhooks/sandbox:
    post:
      tags: [Webhooks]
      operationId: receiveSandboxWebhook
      summary: Webhook intake for the AORA simulator provider
      description: >
        Authenticated by an HMAC-SHA-256 signature over the raw body, not by a
        session. Duplicate deliveries are accepted and have no further effect.
      parameters:
        - name: Aora-Sim-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, type, operation_ref, provider_reference, result, amount_minor, asset]
              properties:
                event_id: { type: string }
                type: { const: collection.result }
                operation_ref: { type: string }
                provider_reference: { type: string }
                result: { enum: [succeeded, failed] }
                amount_minor: { $ref: '#/components/schemas/AmountMinor' }
                asset: { type: string }
      responses:
        '200':
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [received, mode]
                properties:
                  received: { const: true }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/ops/reconciliation-runs:
    post:
      tags: [Operations]
      operationId: runReconciliation
      summary: Run reconciliation now
      description: >
        Platform operators only. Compares the provider's settlement report with
        payment intents and the ledger and records differences. Corrects nothing.
      security: [{ session: [] }]
      responses:
        '201':
          description: Run finished
          content:
            application/json:
              schema:
                type: object
                required: [run_id, lines_checked, intents_checked, exceptions_opened, mode]
                properties:
                  run_id: { type: string, format: uuid }
                  lines_checked: { type: integer }
                  intents_checked: { type: integer }
                  exceptions_opened: { type: integer }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/ops/reconciliation-exceptions:
    get:
      tags: [Operations]
      operationId: listReconciliationExceptions
      summary: List reconciliation exceptions, newest first
      security: [{ session: [] }]
      responses:
        '200':
          description: Exceptions
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReconciliationException' }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/ops/reconciliation-exceptions/{id}:
    get:
      tags: [Operations]
      operationId: getReconciliationException
      summary: Inspect one reconciliation exception
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Exception
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationException' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/workspace/members:
    get:
      tags: [Workspace]
      operationId: listMembers
      summary: List the workspace's members
      description: 'Permission: `member.read` (admin, finance).'
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Member' } }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Workspace]
      operationId: addMember
      summary: Add a member by phone number
      description: 'Permission: `member.manage` (admin). Requires a PIN step-up.'
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, role]
              properties:
                phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/workspace/members/{id}:
    patch:
      tags: [Workspace]
      operationId: updateMember
      summary: Change a member's role, or remove them
      description: >
        Permission: `member.manage` (admin). Requires a PIN step-up. Send exactly
        one of `role`, `status` or `branch_id` (null clears the branch). A
        workspace always keeps at least one active admin.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { $ref: '#/components/schemas/Role' }
                status: { const: removed }
                branch_id: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/workspace/branches:
    get:
      tags: [Workspace]
      operationId: listBranches
      summary: List the workspace's branches
      description: 'Permission: `branch.read` (admin, finance, cashier).'
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Branch' } }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Workspace]
      operationId: createBranch
      summary: Add a branch
      description: 'Permission: `branch.manage` (admin). Names are unique in a workspace.'
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Branch added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/workspace/branches/{id}:
    patch:
      tags: [Workspace]
      operationId: updateBranch
      summary: Rename, close or reopen a branch
      description: 'Permission: `branch.manage` (admin). A closed branch takes no new collections.'
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                status: { enum: [active, closed] }
      responses:
        '200':
          description: Branch updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/ledger/balances:
    get:
      tags: [Workspace]
      operationId: listBalances
      summary: The workspace's ledger balances, one per account type
      description: >
        Permission: `ledger.read` (admin, finance). Each account type is a
        different kind of balance; they are never added together.
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [account_type, currency, balance_minor]
                      properties:
                        account_type: { type: string }
                        currency: { type: string }
                        balance_minor: { type: string, pattern: '^-?[0-9]+$' }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/terms/{key}:
    get:
      tags: [Consent]
      operationId: getTerms
      summary: The terms version currently in effect
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Terms
          content:
            application/json:
              schema:
                type: object
                required: [key, version, language, title, body, body_sha256, effective_from, mode]
                properties:
                  key: { type: string }
                  version: { type: string }
                  language: { type: string }
                  title: { type: string }
                  body: { type: string }
                  body_sha256: { type: string }
                  effective_from: { type: string, format: date-time }
                  mode: { $ref: '#/components/schemas/Mode' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/consents:
    post:
      tags: [Consent]
      operationId: recordConsent
      summary: Record consent to a terms version
      description: >
        Records the person, the capacity in which they act, the action, the time
        and the exact terms version. The version must be the one in effect.
        `workspace_id` is required for `business` capacity and refused otherwise.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [terms_key, terms_version, action, capacity]
              properties:
                terms_key: { type: string }
                terms_version: { type: string }
                action: { type: string }
                capacity: { enum: [personal, business] }
                workspace_id: { type: string, format: uuid }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [id, created_at, mode]
                properties:
                  id: { type: string, format: uuid }
                  created_at: { type: string, format: date-time }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/internal/cron/outbox:
    get:
      tags: [Internal]
      operationId: cronOutbox
      summary: Drain the outbox (called by the scheduler)
      description: Idempotent and time-bounded. Authenticated with the cron secret.
      security: [{ cron: [] }]
      responses:
        '200': { $ref: '#/components/responses/Job' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/internal/cron/sim-webhooks:
    get:
      tags: [Internal]
      operationId: cronSimulatorWebhooks
      summary: Deliver due simulator webhooks (sandbox only)
      security: [{ cron: [] }]
      responses:
        '200': { $ref: '#/components/responses/Job' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/internal/cron/reconciliation:
    get:
      tags: [Internal]
      operationId: cronReconciliation
      summary: Run reconciliation unless a run is already in progress
      security: [{ cron: [] }]
      responses:
        '200': { $ref: '#/components/responses/Job' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: What AORA has sent the signed-in person, and its delivery status
      security: [{ session: [] }]
      responses:
        '200':
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, type, channel, status, subject, sent_to, created_at, sent_at]
                      properties:
                        id: { type: string, format: uuid }
                        type: { type: string }
                        channel: { enum: [email] }
                        status: { enum: [queued, sent, delivered, bounced, complained, failed, status_unknown] }
                        subject: { type: [string, 'null'] }
                        sent_to: { type: [string, 'null'], description: Masked address. }
                        created_at: { type: string, format: date-time }
                        sent_at: { type: [string, 'null'], format: date-time }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/webhooks/clerk:
    post:
      tags: [Webhooks]
      operationId: receiveClerkWebhook
      summary: Identity provider events (user sync; sign-in emails to deliver)
      description: Authenticated by a Svix signature over the raw body. Idempotent per delivery.
      responses:
        '200': { $ref: '#/components/responses/Received' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/webhooks/resend:
    post:
      tags: [Webhooks]
      operationId: receiveResendWebhook
      summary: Email provider events (delivery status)
      description: Authenticated by a Svix signature over the raw body. Idempotent per delivery.
      responses:
        '200': { $ref: '#/components/responses/Received' }
        '401': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: The identity provider's (Clerk's) session token for the signed-in user.
    cron:
      type: http
      scheme: bearer
      description: The deployment's cron secret. Sent by the scheduler only.
  parameters:
    Workspace:
      name: Aora-Workspace-Id
      in: header
      required: true
      description: The workspace to act in. The caller must be a member.
      schema: { type: string, format: uuid }
  requestBodies:
    ChallengeAnswer:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [challenge_id, code]
            properties:
              challenge_id: { type: string }
              code: { type: string, minLength: 1, maxLength: 12 }
  responses:
    Challenge:
      description: Challenge started
      content:
        application/json:
          schema:
            type: object
            required: [challenge_id, mode]
            properties:
              challenge_id: { type: string, format: uuid }
              mode: { $ref: '#/components/schemas/Mode' }
    Received:
      description: Received
      content:
        application/json:
          schema:
            type: object
            required: [received, mode]
            properties:
              received: { const: true }
              mode: { $ref: '#/components/schemas/Mode' }
    Job:
      description: Job result
      content:
        application/json:
          schema:
            type: object
            required: [job, mode]
            properties:
              job: { type: string }
              mode: { $ref: '#/components/schemas/Mode' }
    PaymentIntent:
      description: Payment intent
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaymentIntent' }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Mode:
      const: sandbox
      description: Every record and response is sandbox data.
    Role:
      enum: [admin, finance, cashier]
    Member:
      type: object
      required: [id, account_id, role, status, branch_id, phone_hint]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        status: { enum: [active, removed] }
        branch_id: { type: [string, 'null'], format: uuid }
        phone_hint: { type: string, description: Last three digits of the member's phone number. }
        mode: { $ref: '#/components/schemas/Mode' }
    Branch:
      type: object
      required: [id, name, status, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { enum: [active, closed] }
        created_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    FeeMinor:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: Integer amount in the currency's minor units, as a string. May be zero.
    AmountMinor:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: Integer amount in the currency's minor units, as a string.
      examples: ['15000']
    PaymentIntentStatus:
      description: |
        - `created`: accepted by AORA, not yet sent to the provider.
        - `submitting`: being sent to the provider.
        - `pending_provider`: accepted by the provider, awaiting its result.
        - `succeeded`: paid, and recorded in the ledger.
        - `failed`: not paid.
        - `status_unknown`: the provider did not answer. AORA is asking it; the payment may or may not have happened. Do not retry.
        - `reconciliation_required`: the provider's information conflicts with AORA's records. An operator must review it.
      enum:
        - created
        - submitting
        - pending_provider
        - succeeded
        - failed
        - status_unknown
        - reconciliation_required
    PaymentIntent:
      type: object
      required:
        - id
        - status
        - amount_minor
        - fee_minor
        - net_minor
        - tariff_version_id
        - currency
        - rail
        - branch_id
        - reference
        - provider
        - failure_code
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PaymentIntentStatus' }
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
          description: Gross, what the payer pays.
        fee_minor:
          $ref: '#/components/schemas/FeeMinor'
          description: AORA's fee, fixed when the collection was created.
        net_minor:
          $ref: '#/components/schemas/FeeMinor'
          description: What the merchant receives. Always gross minus fee.
        tariff_version_id:
          type: [string, 'null']
          format: uuid
          description: The tariff version the fee was calculated from.
        currency: { type: string }
        rail: { type: string }
        branch_id: { type: [string, 'null'], format: uuid }
        reference: { type: [string, 'null'] }
        provider: { type: string }
        failure_code: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
    ReconciliationException:
      type: object
      required: [id, type, status, workspace_id, subject_type, subject_ref, detail, run_id, created_at]
      properties:
        id: { type: string, format: uuid }
        type:
          enum:
            - missing_internal
            - missing_at_provider
            - amount_mismatch
            - duplicate_reference
            - state_mismatch
            - stuck_status_unknown
            - ledger_mismatch
            - provider_result_conflict
        status: { enum: [open] }
        workspace_id: { type: [string, 'null'], format: uuid }
        subject_type: { type: string }
        subject_ref: { type: string }
        detail: { type: object }
        run_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error, mode]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              enum:
                - invalid_request
                - unauthenticated
                - forbidden
                - step_up_required
                - reverification_required
                - not_found
                - idempotency_key_required
                - idempotency_key_reused
                - invalid_state_transition
                - capability_not_supported
                - limit_exceeded
                - invalid_signature
                - too_many_attempts
                - pin_not_set
                - conflict
                - internal_error
            message: { type: string }
            request_id: { type: string }
        mode: { $ref: '#/components/schemas/Mode' }

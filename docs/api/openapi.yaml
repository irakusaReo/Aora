  /v1/chiwo/nam:
    get:
      tags: [CHIWO]
      operationId: chiwoGetNam
      summary: The NAM Vault for the signed-in person (personal investor profile) (sandbox; no return offered)
      description: >
        Personal (CHIWO): the signed-in person's own investor profile, never a workspace's; refuses `Aora-Workspace-Id`. Product facts, the current
        disclosure, and the person's funding set aside, shares held and what the
        vault would return for them now (the contract's `convertToAssets`, never a
        rate). `chain_unavailable` until the vault is deployed in this environment.
      security: [{ session: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamOverview' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/chiwo/nam/orders:
    get:
      tags: [CHIWO]
      operationId: chiwoListNamOrders
      summary: NAM orders, newest first
      description: "Personal (CHIWO): the signed-in person's own investor profile, never a workspace's; refuses `Aora-Workspace-Id`."
      security: [{ session: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/NamOrder' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [CHIWO]
      operationId: chiwoPlaceNamOrder
      summary: Fund the NAM Vault from the personal USDC balance
      description: >
        Personal (CHIWO): the signed-in person's own investor profile, never a workspace's; refuses `Aora-Workspace-Id`. Requires a PIN step-up. Records
        personal-capacity consent to the named version of `nam_vault_disclosure_personal` (`conflict` if it
        is not the current one) and sets the amount aside at once
        (`insufficient_funds` otherwise). The holding appears only from the vault's
        `Deposit` event in a confirmed receipt.
      security: [{ session: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_minor, disclosure_version]
              properties:
                amount_minor: { $ref: '#/components/schemas/AmountMinor' }
                disclosure_version: { type: string }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamOrder' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamOrder' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/chiwo/nam/redemptions:
    get:
      tags: [CHIWO]
      operationId: chiwoListNamRedemptions
      summary: NAM redemptions, newest first
      description: "Personal (CHIWO): the signed-in person's own investor profile, never a workspace's; refuses `Aora-Workspace-Id`."
      security: [{ session: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/NamRedemption' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [CHIWO]
      operationId: chiwoRequestNamRedemption
      summary: Redeem shares back to the personal USDC balance
      description: >
        Personal (CHIWO): the signed-in person's own investor profile, never a workspace's; refuses `Aora-Workspace-Id`. Requires a PIN step-up. `shares`
        or `all: true`. `insufficient_funds` above the shares not already being
        redeemed. Completes only from the vault's `Withdraw` event in a confirmed
        receipt; the personal USDC balance receives what the vault returned.
      security: [{ session: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, additionalProperties: false, required: [shares], properties: { shares: { type: string, pattern: '^[1-9][0-9]*$' } } }
                - { type: object, additionalProperties: false, required: [all], properties: { all: { const: true } } }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamRedemption' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamRedemption' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/treasury:
    get:
      tags: [Treasury]
      operationId: getTreasury
      summary: USDC treasury on Base Sepolia (sandbox)
      description: >
        Permission: `treasury.read` (admin, finance). SANDBOX: testnet USDC on Base Sepolia only (phase-5 plan 5C). USDC balances are
        separate from KES and from every other balance. Deposits go to AORA's
        sandbox testnet wallet and count only from a registered address, after the
        confirmation policy. `chain_unavailable` when Base Sepolia is not configured.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Treasury' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/treasury/address-challenges:
    post:
      tags: [Treasury]
      operationId: createTreasuryAddressChallenge
      summary: A one-time message to sign, proving control of a deposit address
      description: >
        Permission: `treasury.manage` (admin). The message names no workspace and
        moves nothing. Expires after ten minutes; usable once.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [id, message, expires_at], properties: { id: { type: string, format: uuid }, message: { type: string }, expires_at: { type: string, format: date-time }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/treasury/addresses:
    get:
      tags: [Treasury]
      operationId: listTreasuryAddresses
      summary: Registered deposit addresses
      description: Permission `treasury.read` (admin, finance).
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/TreasuryAddress' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Treasury]
      operationId: registerTreasuryAddress
      summary: Register a deposit address with its signature of a challenge
      description: >
        Permission: `treasury.manage` (admin). Requires a PIN step-up. The
        signature is an EIP-191 personal signature of the challenge message,
        checked off chain. `invalid_signature` if it does not match;
        `conflict` if the challenge was used or expired, or the address is already
        registered to any workspace. Only deposits observed after registration
        are credited.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, address, signature]
              properties:
                challenge_id: { type: string, format: uuid }
                address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
                signature: { type: string, pattern: '^0x[0-9a-fA-F]+$' }
                label: { type: string, minLength: 1, maxLength: 60 }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryAddress' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/treasury/addresses/{id}/revocation:
    post:
      tags: [Treasury]
      operationId: revokeTreasuryAddress
      summary: Stop crediting deposits from an address
      description: Permission `treasury.manage` (admin). Requires a PIN step-up.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryAddress' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/treasury/transfers:
    get:
      tags: [Treasury]
      operationId: listTreasuryTransfers
      summary: Deposits credited to the workspace and its withdrawals
      description: Permission `treasury.read` (admin, finance).
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/TreasuryTransfer' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/treasury/withdrawals:
    get:
      tags: [Treasury]
      operationId: listTreasuryWithdrawals
      summary: USDC withdrawals, newest first
      description: Permission `treasury.read` (admin, finance).
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Withdrawal' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Treasury]
      operationId: requestTreasuryWithdrawal
      summary: Request a USDC withdrawal (needs a second person's approval)
      description: >
        Permission: `treasury.withdraw` (admin, finance). Requires a PIN step-up.
        Reserves the amount at once. Refused with `invalid_destination` (zero
        address, the USDC contract, AORA's wallet, or any contract),
        `limit_exceeded` (tier limits, as data) or `insufficient_funds`. Nothing is
        sent until a different admin approves.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_minor, destination]
              properties:
                amount_minor: { $ref: '#/components/schemas/AmountMinor' }
                destination: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/treasury/withdrawals/{id}/approval:
    post:
      tags: [Treasury]
      operationId: approveTreasuryWithdrawal
      summary: Approve a withdrawal; it is then signed and broadcast once
      description: >
        Permission: `treasury.approve` (admin). Requires a PIN step-up. Refused
        (`forbidden`) for the person who requested it. A transaction hash is not
        completion: the withdrawal completes after the confirmation policy, and a
        transaction whose outcome is unknown is never sent again.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/treasury/withdrawals/{id}/rejection:
    post:
      tags: [Treasury]
      operationId: rejectTreasuryWithdrawal
      summary: Reject a withdrawal and release its reserve
      description: Permission `treasury.approve` (admin).
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 500 } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/ops/chain/transfers:
    get:
      tags: [Ops]
      operationId: listOpsChainTransfers
      summary: Inbound Base Sepolia transfers that need an operator (sandbox)
      description: >
        Operators only. Default: `unattributed` USDC and `unexpected_asset` (any
        other token, never credited). Filter with `status`.
      security: [{ session: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { enum: [unattributed, unexpected_asset, credited, confirmed, observed, dropped] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { type: object } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/ops/chain/transfers/{id}/attribution:
    post:
      tags: [Ops]
      operationId: attributeOpsChainTransfer
      summary: Attribute an unattributed USDC deposit, with a reason (sandbox)
      description: >
        Operators only. To a workspace (`workspace_id`, for a deposit sent before
        its address was registered) or, without one, to AORA's own sandbox
        funding (faucet USDC). One journal entry; audited with the reason.
        `conflict` unless the transfer is unattributed USDC.
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                workspace_id: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [id, status, attributed_to], properties: { id: { type: string, format: uuid }, status: { const: credited }, attributed_to: { type: string }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/internal/cron/chain:
    get:
      tags: [Internal]
      operationId: cronChain
      summary: Base Sepolia monitor and inbound-transfer scan (sandbox)
      description: >
        Moves AORA's sent transactions on by query only (a transaction in
        `status_unknown` is never sent again), reads Transfer events to the
        sandbox wallet over bounded block ranges from a stored cursor, and
        applies the confirmation policy. Tokens other than native USDC are
        recorded as `unexpected_asset` and never credited. Idempotent and
        time-bounded. `skipped` when Base Sepolia is not configured.
        Authenticated with the cron secret.
      security: [{ cron: [] }]
      responses:
        '200': { $ref: '#/components/responses/Job' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/internal/cron/kelo-provisioning-backfill:
    get:
      tags: [Internal]
      operationId: cronKeloProvisioningBackfill
      summary: Start provisioning for approved stores that never finished it
      description: Idempotent and time-bounded. Authenticated with the cron secret.
      security: [{ cron: [] }]
      responses:
        '200': { $ref: '#/components/responses/Job' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/kelo/categories:
    get:
      tags: [KELO]
      operationId: listKeloCategories
      summary: The current KELO taxonomy (data, never code)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { type: object, required: [slug, name, version, listing_types, restricted], properties: { slug: { type: string }, name: { type: string }, version: { type: integer }, listing_types: { type: array, items: { type: string } }, restricted: { type: boolean } } } }, mode: { $ref: '#/components/schemas/Mode' } } }
  /v1/kelo/marketplace/listings:
    get:
      tags: [KELO]
      operationId: searchKeloMarketplace
      summary: Published listings, newest first, with optional full-text search
      description: >
        Public. Only published listings are ever returned; anything else looks like it does not exist.
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data, next_cursor], properties: { data: { type: array, items: { $ref: '#/components/schemas/KeloListingSummary' } }, next_cursor: { type: [string, 'null'] }, mode: { $ref: '#/components/schemas/Mode' } } }
        '400': { $ref: '#/components/responses/Error' }
  /v1/kelo/marketplace/listings/{id}:
    get:
      tags: [KELO]
      operationId: getKeloMarketplaceListing
      summary: A published listing
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeloPublicListing' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/workspace/kelo/store:
    get:
      tags: [KELO]
      operationId: getWorkspaceKeloStore
      summary: The KELO store of the workspace, and the categories it may list in
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '200':
          description: OK. `store` is null when the workspace has no approved KELO store.
          content:
            application/json:
              schema:
                type: object
                required: [store]
                properties:
                  store:
                    oneOf:
                      - type: 'null'
                      - type: object
                        required: [id, display_name, categories]
                        properties:
                          id: { type: string, format: uuid }
                          display_name: { type: string }
                          categories:
                            type: array
                            items: { type: object, properties: { slug: { type: string }, name: { type: string }, listing_types: { type: array, items: { type: string } } } }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/workspace/kelo/listings:
    get:
      tags: [KELO]
      operationId: listKeloListings
      summary: Listings of the workspace
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/KeloListing' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [KELO]
      operationId: createKeloListing
      summary: Create a draft listing
      description: >
        Admin only. The category must be one the store was vetted for, and must allow the listing type.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      requestBody:
        required: true
        content:
          application/json:
            schema:

            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/ApiKey' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Developer]
      operationId: createApiKey
      summary: Create an API key, shown once
      description: >
        Permission: `api_key.manage` (admin). Requires a PIN step-up. Stored only as a hash. Scope `collect` acts like a cashier; `full` like finance. A key can never pass a step-up, so it can never pay out, refund, invite or manage keys (ADR 0023).
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scope]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                scope: { enum: [collect, full] }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { allOf: [{ $ref: '#/components/schemas/ApiKey' }, { type: object, required: [key], properties: { key: { type: string, description: Shown only in this response. } } }] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/api-keys/{id}:
    delete:
      tags: [Developer]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: >
        Permission: `api_key.manage`. Requires a PIN step-up. Immediate and permanent.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/webhook-endpoints:
    get:
      tags: [Developer]
      operationId: listWebhookEndpoints
      summary: List webhook endpoints
      description: >
        Permission: `webhook.read` (admin, finance).
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/WebhookEndpoint' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Developer]
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      description: >
        Permission: `webhook.manage` (admin). Requires a PIN step-up. On deployed environments HTTPS only, never a private or loopback address.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, event_types]
              properties:
                url: { type: string, format: uri }
                event_types:
                  type: array
                  minItems: 1
                  items: { enum: [payment_intent.succeeded, payment_intent.failed, payout.succeeded, payout.failed, refund.succeeded, refund.failed] }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/webhook-deliveries:
    get:
      tags: [Developer]
      operationId: listWebhookDeliveries
      summary: The delivery log, newest first
      description: >
        Permission: `webhook.read` (admin, finance). Every attempt is counted; a delivery that keeps failing becomes `dead`.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/webhook-deliveries/{id}/replay:
    post:
      tags: [Developer]
      operationId: replayWebhookDelivery
      summary: Send a delivery again
      description: >
        Permission: `webhook.manage`. Requires a PIN step-up. Same event id and body, so a receiver that deduplicates on the id sees no second effect.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [id, replay_of], properties: { id: { type: string, format: uuid }, replay_of: { type: string, format: uuid }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/webhook-signing-key:
    get:
      tags: [Developer]
      operationId: getWebhookSigningKey
      summary: The public key that verifies every AORA webhook
      description: >
        Public. Each webhook carries `Aora-Signature: t=<unix seconds>,v1=<base64 Ed25519 signature of "t.body">` and `Aora-Event-Id`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [algorithm, key_id, public_key_pem], properties: { algorithm: { const: ed25519 }, key_id: { type: string }, public_key_pem: { type: string }, mode: { $ref: '#/components/schemas/Mode' } } }
        '422': { $ref: '#/components/responses/Error' }
  /v1/ledger/balances:
    get:
      tags: [Workspace]
      operationId: listBalances
      summary: The workspace's ledger balances, one per account type
      description: >
        Permission: `ledger.read` (admin, finance). Each account type is a
        different kind of balance; they are never added together.
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/Workspace' }]
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [account_type, currency, balance_minor]
                      properties:
                        account_type: { type: string }
                        currency: { type: string }
                        balance_minor: { type: string, pattern: '^-?[0-9]+$' }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/terms/{key}:
    get:
      tags: [Consent]
      operationId: getTerms
      summary: The terms version currently in effect
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Terms
          content:
            application/json:
              schema:
                type: object
                required: [key, version, language, title, body, body_sha256, effective_from, mode]
                properties:
                  key: { type: string }
                  version: { type: string }
                  language: { type: string }
                  title: { type: string }
                  body: { type: string }
                  body_sha256: { type: string }
                  effective_from: { type: string, format: date-time }
                  mode: { $ref: '#/components/schemas/Mode' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/consents:
    post:
      tags: [Consent]
      operationId: recordConsent
      summary: Record consent to a terms version
      description: >
        Records the person, the capacity in which they act, the action, the time
        and the exact terms version. The version must be the one in effect.
        `workspace_id` is required for `business` capacity and refused otherwise.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [terms_key, terms_version, action, capacity]
              properties:
                terms_key: { type: string }
                terms_version: { type: string }
                action: { type: string }
                capacity: { enum: [personal, business] }
                workspace_id: { type: string, format: uuid }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [id, created_at, mode]
                properties:
                  id: { type: string, format: uuid }
                  created_at: { type: string, format: date-time }
                  mode: { $ref: '#/components/schemas/Mode' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/internal/cron/outbox:
    get:
      tags: [Internal]
      operationId: cronOutbox
      summary: Drain the outbox (called by the scheduler)
      description: Idempotent and time-bounded. Authenticated with the cron secret.
      security: [{ cron: [] }]
      responses:
        '200': { $ref: '#/components/responses/Job' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/internal/cron/sim-webhooks:
    get:
      tags: [Internal]
      operationId: cronSimulatorWebhooks
      summary: Deliver due simulator webhooks (sandbox only)
      security: [{ cron: [] }]
      responses:
        '200': { $ref: '#/components/responses/Job' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/internal/cron/reconciliation:
    get:
      tags: [Internal]
      operationId: cronReconciliation
      summary: Run reconciliation unless a run is already in progress
      security: [{ cron: [] }]
      responses:
        '200': { $ref: '#/components/responses/Job' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: What AORA has sent the signed-in person, and its delivery status
      security: [{ session: [] }]
      responses:
        '200':
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, type, channel, status, subject, sent_to, created_at, sent_at]
                      properties:
                        id: { type: string, format: uuid }
                        type: { type: string }
                        channel: { enum: [email] }
                        status: { enum: [queued, sent, delivered, bounced, complained, failed, status_unknown] }
                        subject: { type: [string, 'null'] }
                        sent_to: { type: [string, 'null'], description: Masked address. }
                        created_at: { type: string, format: date-time }
                        sent_at: { type: [string, 'null'], format: date-time }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/webhooks/clerk:
    post:
      tags: [Webhooks]
      operationId: receiveClerkWebhook
      summary: Identity provider events (user sync; sign-in emails to deliver)
      description: Authenticated by a Svix signature over the raw body. Idempotent per delivery.
      responses:
        '200': { $ref: '#/components/responses/Received' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/webhooks/resend:
    post:
      tags: [Webhooks]
      operationId: receiveResendWebhook
      summary: Email provider events (delivery status)
      description: Authenticated by a Svix signature over the raw body. Idempotent per delivery.
      responses:
        '200': { $ref: '#/components/responses/Received' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/kelo/stores:
    get:
      tags: [KELO]
      operationId: listKeloStores
      summary: The signed-in person's own store enlistments
      security: [{ session: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/KeloStore' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [KELO]
      operationId: enlistKeloStore
      summary: Enlist a store on KELO
      description: >
        Either names an existing KONY workspace the caller administers (`business.workspace_id`), or gives a new business's details. The store is `submitted` until an operator vets it. Approval starts provisioning (ADR 0008): the store gets, or is linked to, exactly one KONY workspace. Needs a phone number on the account (`phone_required`).
      security: [{ session: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name, categories, business]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 80 }
                categories: { type: array, minItems: 1, maxItems: 12, items: { type: string, examples: [electronics] } }
                business:
                  description: An existing workspace, or the details of a new business (as for onboarding).
                  type: object
                  properties:
                    workspace_id: { type: string, format: uuid }
                    kind: { enum: [registered, unregistered] }
                    name: { type: string, minLength: 1, maxLength: 120 }
                    country: { type: string, pattern: '^[A-Z]{2}$' }
                    registration: { type: object, required: [type, value], properties: { type: { type: string }, value: { type: string } } }
                    location: { type: object, required: [area, locality, place], properties: { area: { type: string }, locality: { type: string }, place: { type: string } } }
                sandbox_kyb:
                  description: Sandbox only. Scripts the answer of the sandbox verification adapter.
                  enum: [verified, unverified]
      responses:
        '201':
          description: Enlistment received
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeloStore' }
        '200':
          description: Replay of an earlier request with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeloStore' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/kelo/stores/{id}:
    get:
      tags: [KELO]
      operationId: getKeloStore
      summary: One of the signed-in person's store enlistments
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeloStore' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/ops/kelo/stores:
    get:
      tags: [Operations]
      operationId: listKeloStoresForVetting
      summary: Store enlistments by status (default submitted)
      description: Operator only.
      security: [{ session: [] }]
      parameters:
        - { name: status, in: query, schema: { enum: [submitted, approved, rejected] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/KeloStore' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/ops/kelo/stores/{id}:
    get:
      tags: [Operations]
      operationId: getKeloStoreForVetting
      summary: A store enlistment with each category's vetting requirements
      description: Operator only.
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeloStoreForVetting' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/ops/kelo/stores/{id}/decision:
    post:
      tags: [Operations]
      operationId: decideKeloStore
      summary: Vet a store
      description: >
        Operator only. Approval needs every vetting requirement of every category attested (sandbox: the operator attests; no KYB provider, D-8). Restrictions are copied to the workspace and enforced there. Final and audited.
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome, reason, attestations]
              properties:
                outcome: { enum: [approved, rejected] }
                reason: { type: string, minLength: 10, maxLength: 500 }
                attestations: { type: object, additionalProperties: { type: array, items: { type: string } } }
                restrictions: { type: array, items: { enum: [payouts_suspended, listing_suspended] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeloStore' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/ops/kelo/provisioning:
    get:
      tags: [Operations]
      operationId: listKeloProvisioning
      summary: Provisioning records by status (default failed_needs_review)
      description: Operator only.
      security: [{ session: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/KeloProvisioningStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/KeloProvisioning' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/ops/kelo/provisioning/{id}/retry:
    post:
      tags: [Operations]
      operationId: retryKeloProvisioning
      summary: Send a stopped or failing record back to its last committed step
      description: Operator only. The same rules decide again; audited.
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeloProvisioning' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/ops/workspaces/{id}/restrictions/{kind}/lift:
    post:
      tags: [Operations]
      operationId: liftWorkspaceRestriction
      summary: Lift a workspace restriction
      description: Operator only, with a reason. Audited.
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: kind, in: path, required: true, schema: { enum: [payouts_suspended, listing_suspended] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [restrictions], properties: { restrictions: { type: array, items: { type: string } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/nam:
    get:
      tags: [NAM]
      operationId: getNam
      summary: The NAM Vault for this workspace (sandbox; no return offered)
      description: >
        Permission: `nam.read` (admin, finance). Product facts, the current
        disclosure, and the workspace's funding set aside, shares held and what the
        vault would return for them now (the contract's `convertToAssets`, never a
        rate). `chain_unavailable` until the vault is deployed in this environment.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamOverview' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/nam/orders:
    get:
      tags: [NAM]
      operationId: listNamOrders
      summary: NAM orders, newest first
      description: Permission `nam.read` (admin, finance).
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/NamOrder' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [NAM]
      operationId: placeNamOrder
      summary: Fund the NAM Vault from the USDC treasury
      description: >
        Permission: `nam.invest` (admin, finance). Requires a PIN step-up. Records
        business-capacity consent to the named disclosure version (`conflict` if it
        is not the current one) and sets the amount aside at once
        (`insufficient_funds` otherwise). The holding appears only from the vault's
        `Deposit` event in a confirmed receipt.
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/Workspace' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_minor, disclosure_version]
              properties:
                amount_minor: { $ref: '#/components/schemas/AmountMinor' }
                disclosure_version: { type: string }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamOrder' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamOrder' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

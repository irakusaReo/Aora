          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/KeloPurchase' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }

        '201':
          description: Application decided or queued for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingApplication' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

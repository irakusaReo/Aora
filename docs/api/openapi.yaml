      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/OnboardingApplication' } }, mode: { $ref: '#/components/schemas/Mode' } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Onboarding]
      operationId: createApplication
      summary: Apply to bring a business onto AORA
      description: >
        Matched against existing businesses (ADR 0012). A clear new business is `approved` at once and gets a workspace with the applicant as admin. A possible duplicate is `needs_review` and creates nothing. A business that is already onboarded is `rejected`: join it by invitation. Needs a phone number on the account (`phone_required`).
      security: [{ session: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name, country]
              properties:
                kind: { enum: [registered, unregistered] }
                name: { type: string, minLength: 1, maxLength: 120 }
                country: { type: string, pattern: '^[A-Z]{2}$' }
                registration:
                  description: Required when kind is registered.
                  type: object
                  required: [type, value]
                  properties:
                    type: { type: string, examples: [sandbox_registration_number] }
                    value: { type: string, maxLength: 60 }
                location:
                  description: Required when kind is unregistered.
                  type: object
                  required: [area, locality, place]
                  properties:
                    area: { type: string }
                    locality: { type: string }
                    place: { type: string }
                sandbox_kyb:
                  description: Sandbox only. Scripts the answer of the sandbox verification adapter.
                  enum: [verified, unverified]

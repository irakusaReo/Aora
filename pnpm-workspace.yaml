# Globs are added when the first package of that kind is created (ADR 0001).
packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

allowBuilds:
  '@prisma/engines': true
  prisma: true
  # Pulled in by the Expo apps; their install scripts only print banners.
  browser-tabs-lock: false
  core-js: false

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.13'
  - '@expo/metro-config@58.0.15'
  - '@expo/router-server@58.0.15'
  - babel-preset-expo@58.0.18
  - expo-asset@58.0.17
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo-modules-cli@0.3.1
  - expo-modules-core@58.0.23
  - expo-modules-jsi@58.0.16
  - expo-router@58.0.24
  - expo@58.0.16

saveExact: true

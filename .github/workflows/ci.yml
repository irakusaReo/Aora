name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (Foundry, Slither)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.4

      - name: Format, build and test (unit, fuzz, invariant)
        working-directory: contracts
        run: |
          forge fmt --check src script test
          forge build --sizes
          forge test

      - name: Check the ABIs the API uses match the contracts
        run: |
          node contracts/scripts/export-abis.mjs
          npx --yes prettier@3.9.10 --log-level warn --write services/api/src/modules/chain/abi
          git diff --exit-code -- services/api/src/modules/chain/abi

      # ADR 0015 rule 5: static analysis. Slither 0.11.6 (PyPI, 2026-07-28).
      - name: Static analysis
        run: |
          python3 -m venv "$RUNNER_TEMP/slither"
          "$RUNNER_TEMP/slither/bin/pip" install --quiet slither-analyzer==0.11.6
          "$RUNNER_TEMP/slither/bin/slither" contracts --filter-paths "lib|test|script" --fail-low

  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Throwaway database for tests. Trust authentication, no data, sandbox only.
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AORA_TEST_PG_HOST: 127.0.0.1
      AORA_TEST_PG_PORT: '5432'
      AORA_TEST_POOLER_PORT: '6432'
      DATABASE_URL_OWNER: postgresql://aora_owner@127.0.0.1:5432/aora_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # forge-std and OpenZeppelin are pinned submodules under contracts/lib.
          submodules: recursive

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Anvil is the local chain for the API's chain tests (phase-5 plan P5-2);
      # forge checks the TEST-ONLY token artifact is current. Pinned (ADR 0006).
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.4

      - name: Check the local-chain test tokens match their source
        run: |
          (cd contracts && forge build)
          node contracts/scripts/export-test-tokens.mjs
          git diff --exit-code -- services/api/test/support/test-tokens.json

      - name: Start a transaction-mode pooler in front of the test database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pgbouncer
          sudo systemctl stop pgbouncer || true
          mkdir -p "$RUNNER_TEMP/pgbouncer"
          printf '"aora_owner" ""\n"aora_app" ""\n"aora_platform" ""\n"postgres" ""\n' > "$RUNNER_TEMP/pgbouncer/userlist.txt"
          cat > "$RUNNER_TEMP/pgbouncer/pgbouncer.ini" <<INI
          [databases]
          * = host=127.0.0.1 port=5432
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          unix_socket_dir =
          auth_type = trust
          auth_file = $RUNNER_TEMP/pgbouncer/userlist.txt
          pool_mode = transaction
          default_pool_size = 1
          max_client_conn = 500
          logfile = $RUNNER_TEMP/pgbouncer/pgbouncer.log
          pidfile = $RUNNER_TEMP/pgbouncer/pgbouncer.pid
          INI
          pgbouncer -d "$RUNNER_TEMP/pgbouncer/pgbouncer.ini"

      - name: Create database roles and apply migrations
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f services/api/prisma/bootstrap.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "create database aora_ci owner aora_owner"
          pnpm db:migrate

      - name: Check schema.prisma matches the migrations
        run: |
          pnpm -r db:pull
          git diff --exit-code -- services/api/prisma/schema.prisma

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # The web apps must compile. The publishable key is a syntactically valid
      # placeholder for an instance that does not exist: nothing is fetched at build.
      - name: Build the web apps
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktYnVpbGQuY2xlcmsuYWNjb3VudHMuZGV2JA==
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm --filter kony-web --filter internal-ops --filter kelo-web build

  # Applies SQL migrations to AORA staging (Neon `main`) through the DIRECT
  # connection, only on `main` and only after the tests above pass. Migrations
  # never run from the Vercel build, and are backward-compatible: expand first,
  # contract in a later release (ADR 0013).
  migrate-staging:
    name: Migrate staging
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: migrate-staging
      cancel-in-progress: false
    env:
      STAGING_DATABASE_URL_OWNER: ${{ secrets.STAGING_DATABASE_URL_OWNER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: |
          if [ -z "$STAGING_DATABASE_URL_OWNER" ]; then
            echo "::error::STAGING_DATABASE_URL_OWNER is not set as a repository secret; staging was NOT migrated."
            exit 1
          fi
          pnpm db:migrate:staging
